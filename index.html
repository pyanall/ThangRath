      .thim-wait {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 6px;
        padding: 14px 0;
      }
      .thim-wait b {
        font-size: 15.5px;
        margin-top: 6px;
      }
      .thim-wait small {
        font-size: 12.5px;
        color: var(--ink-2);
      }
      .tw-ic {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--green);
        color: #fff;
        display: grid;
        place-items: center;
        animation: dpPop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .spin.lg {
        width: 44px;
        height: 44px;
        border-width: 4px;
      }
      .otp-sent {
        display: flex;
        gap: 8px;
        align-items: center;
        background: var(--green-50);
        color: #13734a;
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 14px;
      }
      .lnk {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--blue);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        margin-top: 2px;
      }
      /* --- ตั้งค่าบัญชี: กล่องสแกน, ช่อง 2 คอลัมน์, เอกสารเพิ่มเติม --- */
      .scanbox {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-align: left;
        padding: 14px;
        border-radius: 20px;
        background: linear-gradient(135deg, var(--navy), var(--blue));
        color: #fff;
        box-shadow: 0 10px 24px rgba(1, 74, 173, 0.28);
      }
      .scanbox.done {
        background: #fff;
        color: var(--ink);
        border: 1.5px solid var(--green);
        box-shadow: var(--sh-1);
      }
      .scanbox b {
        display: block;
        font-size: 15.5px;
      }
      .scanbox small {
        font-size: 12.5px;
        opacity: 0.85;
      }
      .sb-frame {
        width: 58px;
        height: 58px;
        border-radius: 14px;
        border: 2px dashed rgba(255, 255, 255, 0.7);
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
      }
      .scanbox.done .sb-frame {
        border: 0;
        background: var(--green);
        color: #fff;
      }
      .sb-line {
        position: absolute;
        left: 4px;
        right: 4px;
        height: 3px;
        border-radius: 3px;
        background: #7cf0b6;
        box-shadow: 0 0 10px #7cf0b6;
        animation: scanl 1s ease-in-out infinite alternate;
      }
      @keyframes scanl {
        from {
          top: 6px;
        }
        to {
          top: calc(100% - 9px);
        }
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .two .field {
        min-width: 0;
      }
      .xopen {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        margin: 6px 0 10px;
      }
      .xopen b {
        display: block;
        font-size: 14.5px;
      }
      .xopen small {
        font-size: 12.5px;
        color: var(--ink-2);
      }
      /* --- หน้าฟอร์ม: เลยกำหนด / แบบฟอร์มที่ระบบกรอกให้ --- */
      .elig.late {
        background: #fff3e3;
        border: 1px solid #ffd9a8;
      }
      .elig.late .el-ic {
        background: #fff;
        color: var(--amber);
      }
      .elig.late small {
        color: #8a4b00;
        font-weight: 500;
        line-height: 1.5;
      }
      .el-when.red {
        margin: 12px -4px 0;
        padding: 10px 12px;
        border: 0;
        border-radius: 12px;
        background: var(--red-50);
        color: #b42318;
      }
      .el-when.red svg {
        color: var(--red);
      }
      .el-when.red b {
        font-weight: 700;
        margin-right: 2px;
      }
      .el-when.warn {
        color: #8a4b00;
      }
      .el-when.warn svg {
        color: var(--amber);
      }
      .autoform {
        margin-top: 10px;
        padding: 12px 14px;
      }
      .autoform b {
        display: block;
        font-size: 14px;
      }
      .autoform small {
        font-size: 12px;
        color: var(--ink-2);
      }
      .af-v {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      /* หน้าข้อมูลส่วนตัว: ข้อมูลที่พักที่รับแจ้งจากเจ้าของที่พัก */
      .stay-src {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 10px 12px;
        margin-bottom: 4px;
        border-radius: 12px;
        background: var(--leaf-50);
        font-size: 12.5px;
        color: var(--ink-2);
      }
      .stay-src svg {
        color: var(--leaf);
        flex: none;
        margin-top: 1px;
      }
      .stay-src b {
        display: block;
        color: var(--ink);
        font-size: 13.5px;
      }
      .stay-ok {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 12px;
        padding: 11px;
        border-radius: 12px;
        background: var(--green-50);
        color: var(--green);
        font-weight: 600;
        font-size: 14px;
      }
      /* ตม.30: ข้อมูลที่พักที่ดึงอัตโนมัติ + คำแนะนำการย้ายที่พัก */
      .pulled {
        margin-top: 10px;
        padding: 10px 12px 12px;
        border-radius: 12px;
        background: #f3f6fa;
        border: 1px solid #e3e9f1;
      }
      .pulled-h {
        margin-bottom: 2px;
      }
      .pulled .kv b {
        text-align: right;
        max-width: 62%;
      }
      .tips ol {
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: t;
      }
      .tips li {
        counter-increment: t;
        position: relative;
        padding: 0 0 12px 36px;
        font-size: 13.5px;
        line-height: 1.55;
        color: var(--ink-2);
      }
      .tips li::before {
        content: counter(t);
        position: absolute;
        left: 0;
        top: 0;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--blue-50);
        color: var(--blue);
        font-weight: 700;
        font-size: 13px;
        display: grid;
        place-items: center;
      }
      .tips li b {
        display: block;
        color: var(--ink);
        font-size: 14px;
      }
      .tips-note {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--leaf-50);
        color: var(--ink);
        font-size: 13px;
      }
      .tips-note svg {
        color: var(--leaf);
        flex: none;
        margin-top: 1px;
      }
      /* ช่องที่ดึงข้อมูลอัตโนมัติ แก้ในฟอร์มไม่ได้ (type: "ro") */
      .ro-box {
        border: 1px solid #e3e9f1;
        border-radius: 12px;
        padding: 12px 14px;
        background: #f3f6fa;
        font-size: 15px;
        line-height: 1.5;
        color: var(--ink);
        white-space: pre-line;
      }
      .ro-box.empty {
        color: var(--ink-3);
        background: #fff;
        border-style: dashed;
      }
      .ro-note {
        font-size: 12.5px;
        color: var(--ink-2);
        margin-top: 6px;
      }
      .ro-note .lnk {
        font-size: 12.5px;
      }
      .af-v span {
        font-size: 12px;
        background: #f3f6fa;
        border-radius: 8px;
        padding: 3px 9px;
        color: var(--ink);
      }
      /* ==================================================================
         ANIMATION (FX) — ดูฟังก์ชัน fxAfter() ใน <script>
         ================================================================== */
      /* 7) เปลี่ยนหน้า */
      #screen.fx-fwd {
        animation: pgFwd 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #screen.fx-back {
        animation: pgBack 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #screen.fx-fade {
        animation: pgFade 0.3s ease-out;
      }
      @keyframes pgFwd {
        from {
          opacity: 0.2;
          transform: translateX(36px);
        }
      }
      @keyframes pgBack {
        from {
          opacity: 0.2;
          transform: translateX(-36px);
        }
      }
      @keyframes pgFade {
        from {
          opacity: 0;
        }
      }
      /* 5) หน้า Home: การ์ดเลื่อนขึ้นทีละใบ */
      .fx-stagger > * {
        animation: upIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .fx-stagger > *:nth-child(2) {
        animation-delay: 0.06s;
      }
      .fx-stagger > *:nth-child(3) {
        animation-delay: 0.14s;
      }
      .fx-stagger > *:nth-child(4) {
        animation-delay: 0.22s;
      }
      .fx-stagger > *:nth-child(5) {
        animation-delay: 0.28s;
      }
      .fx-stagger > *:nth-child(n + 6) {
        animation-delay: 0.34s;
      }
      @keyframes upIn {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
      }
      /* 6) กล่องเตือนเร่งด่วน: วงแสงกระเพื่อมรอบไอคอน */
      .alert.urgent .ai,
      .sugg.hot .ai {
        animation: pulseRing 2.2s ease-out infinite;
      }
      @keyframes pulseRing {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 164, 27, 0.55);
        }
        70% {
          box-shadow: 0 0 0 12px rgba(255, 164, 27, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(255, 164, 27, 0);
        }
      }
      @keyframes rowIn {
        from {
          opacity: 0;
          transform: translateX(-14px);
        }
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.2);
        }
      }
      /* 2) ผลสแกน: ช่องกระพริบเขียว + ป้าย "จากการสแกน" เด้ง */
      .field.fx-scan input,
      .field.fx-scan select,
      .field.fx-scan textarea {
        animation: scanFlash 1.1s ease-out both;
        animation-delay: calc(var(--i) * 0.22s);
      }
      .field.fx-scan .autotag {
        animation: popIn 0.4s cubic-bezier(0.2, 1.5, 0.4, 1) both;
        animation-delay: calc(0.15s + var(--i) * 0.22s);
      }
      @keyframes scanFlash {
        0% {
          background: #d9f7e8;
          border-color: var(--green);
          box-shadow: 0 0 0 3px rgba(18, 183, 106, 0.18);
        }
      }
      /* 3) วงแหวน + การ์ดเอกสารที่เพิ่งอัปโหลด */
      .ring-w.fx-bump b {
        animation: popIn 0.45s cubic-bezier(0.2, 1.5, 0.4, 1);
      }
      .fx-pop {
        animation: cardPop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .fx-pop .st {
        animation: popIn 0.45s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      @keyframes cardPop {
        0% {
          transform: scale(0.97);
          box-shadow: 0 0 0 0 rgba(18, 183, 106, 0.5);
        }
        50% {
          transform: scale(1.015);
        }
        100% {
          box-shadow: 0 0 0 10px rgba(18, 183, 106, 0);
        }
      }
      /* 4, 10) stepper: เส้นเติมสีไปยังขั้นใหม่ + วงแสงกระเพื่อม */
      .stp li.fx-grow::before {
        transform-origin: left center;
        animation: lineGrow 0.55s cubic-bezier(0.3, 0.9, 0.3, 1) both;
        background: var(--green);
      }
      .stp li.fx-grow .stp-d {
        animation: dotRipple 1s ease-out 0.4s 2;
      }
      @keyframes lineGrow {
        from {
          transform: scaleX(0);
        }
      }
      @keyframes dotRipple {
        0% {
          box-shadow: 0 0 0 0 rgba(38, 129, 219, 0.5);
        }
        100% {
          box-shadow: 0 0 0 14px rgba(38, 129, 219, 0);
        }
      }
      .track li.fx-grow {
        animation: liFlash 1.2s ease-out;
        border-radius: 8px;
      }
      @keyframes liFlash {
        0% {
          background: rgba(38, 129, 219, 0.16);
        }
      }
      /* 10) คำขออนุมัติแล้ว: เครื่องหมายถูกใหญ่กลางจอ */
      .fx-big {
        position: absolute;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(2px);
        animation: pgFade 0.25s ease-out, bigOut 0.35s ease-in 1.15s forwards;
        pointer-events: none;
      }
      .fx-big > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .fx-big span {
        width: 104px;
        height: 104px;
        border-radius: 50%;
        background: var(--green);
        color: #fff;
        display: grid;
        place-items: center;
        box-shadow:
          0 0 0 14px rgba(18, 183, 106, 0.16),
          0 14px 30px rgba(18, 183, 106, 0.35);
        animation: dpPop 0.55s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .fx-big b {
        font-size: 19px;
        color: var(--navy);
        animation: upIn 0.4s 0.2s both;
      }
      @keyframes bigOut {
        to {
          opacity: 0;
        }
      }
      /* 9) หน้ายื่นสำเร็จ: กระดาษสี + เลขอ้างอิงปรากฏทีละตัว */
      .fx-confetti {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 5;
      }
      .fx-confetti i {
        position: absolute;
        top: -14px;
        width: 8px;
        height: 12px;
        border-radius: 2px;
        animation: confFall linear forwards;
      }
      @keyframes confFall {
        to {
          transform: translate(var(--x), 640px) rotate(var(--r));
          opacity: 0;
        }
      }
      .refcard b span {
        display: inline-block;
        animation: charIn 0.32s cubic-bezier(0.2, 1.3, 0.4, 1) both;
        animation-delay: calc(0.45s + var(--i) * 0.045s);
      }
      @keyframes charIn {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.6);
        }
      }
      .dp-scroll > .card,
      .dp-scroll > .sec-title {
        animation: upIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        animation-delay: 0.3s;
      }
      .dp-scroll > .card:last-child {
        animation-delay: 0.45s;
      }
      .nexts li {
        animation: rowIn 0.35s both;
        animation-delay: calc(0.55s + var(--i) * 0.1s);
      }
      @media (prefers-reduced-motion: reduce) {
        #screen,
        .fx-stagger > *,
        .alert.urgent .ai,
        .sugg.hot .ai,
        .field.fx-scan *,
        .fx-pop,
        .stp li.fx-grow::before,
        .stp li.fx-grow .stp-d,
        .refcard b span,
        .dp-scroll > *,
        .nexts li,
        .fx-big,
        .fx-big * {
          animation: none !important;
        }
      }
      /* ==================================================================
         หน้า LANDING (หน้าแรกของแอปทางรัฐ ตามดีไซน์เดิม) + ปุ่มชาวต่างชาติ
         ================================================================== */
      .device.landing-bg {
        background: #fff;
      }
      .device.landing-bg .statusbar {
        background: transparent;
      }
      .land {
        flex: 1;
        min-height: 0;
        overflow: hidden; /* ทุกอย่างอยู่ในหน้าเดียว — ภาพประกอบย่อตามพื้นที่ที่เหลือ */
        padding: 0 20px 18px;
        display: flex;
        flex-direction: column;
      }
      .land > * {
        flex-shrink: 0;
      }
      .land > .land-art-w {
        flex: 1 1 0;
        flex-shrink: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        margin: 0 -20px;
      }
      .land-art {
        display: block;
        height: 100%;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        /* ขอบซ้าย-ขวาจางกลืนกับพื้นขาว เมื่อภาพถูกย่อ */
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%);
        mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%);
      }
      .land-h {
        font-size: 27px;
        line-height: 1.32;
        font-weight: 700;
        color: #2b2b2b;
        margin: 4px 0 14px;
      }
      .land-btn {
        width: 100%;
        height: 46px;
        border-radius: 99px;
        font-size: 16px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .land-btn.reg {
        background: #12924f;
        color: #fff;
        font-size: 18px;
      }
      .land-btn.in {
        background: #fff;
        color: #12924f;
        border: 1px solid #4a8d6a;
      }
      .land-btn.thaid {
        margin-top: 12px;
        background: #0d0f4f;
        color: #fff;
        font-weight: 600;
      }
      /* ส่วนชาวต่างชาติ: การ์ดไล่สีน้ำเงิน */
      .land-or.fx {
        margin: 14px 0 8px;
        color: var(--blue);
        font-weight: 600;
      }
      .land-or.fx::before,
      .land-or.fx::after {
        background: var(--blue-100);
      }
      .land-fx {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        padding: 12px 14px 12px 12px;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--navy) 0%, #0b5fd0 60%, var(--blue) 100%);
        color: #fff;
        box-shadow: 0 8px 20px rgba(1, 74, 173, 0.28);
        position: relative;
        overflow: hidden;
      }
      .land-fx::after {
        content: "";
        position: absolute;
        right: -36px;
        top: -46px;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
      }
      .lfx-ic {
        width: 46px;
        height: 46px;
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.16);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .lfx-t {
        flex: 1;
        line-height: 1.3;
      }
      .lfx-t b {
        display: block;
        font-size: 16px;
      }
      .lfx-t .badge {
        font-size: 10.5px;
        vertical-align: 2px;
      }
      .lfx-t small {
        font-size: 12.5px;
        opacity: 0.85;
      }
      .thaid-b {
        height: 22px;
        width: auto;
        border-radius: 5px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
      }
      .land-or {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 10px 0;
        font-size: 12px;
        color: #9aa3ad;
      }
      .land-or::before,
      .land-or::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e6e9ec;
      }
      .land-safe {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 12px;
        font-size: 13px;
        color: #555;
      }
      .login-back {
        position: relative;
        z-index: 2;
        background: #fff;
        box-shadow: var(--sh-1);
        margin: 0 0 -40px;
      }
      @media (prefers-reduced-motion: reduce) {
        .land-art {
          animation: none;
        }
      }
      /* --- TDAC: โลโก้ QR + หน้าสแกน QR --- */
      .tdac-logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #0e5393;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 4px 10px rgba(14, 83, 147, 0.25);
      }
      .tdac-logo img {
        height: 74%;
        width: auto;
      }
      .tdac-logo i {
        font-style: normal;
        font-size: 8.5px;
        font-weight: 800;
        letter-spacing: 0.5px;
        margin-top: -1px;
      }
      .tdac-logo.lg {
        width: 56px;
        height: 56px;
      }
      .blk-h .tdac-logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
      }
      .qr-scan {
        margin-top: 12px;
        background: #0b1220;
        color: #fff;
        border-radius: 22px;
        padding: 22px 16px 18px;
        text-align: center;
      }
      .qr-scan b {
        display: block;
        margin-top: 14px;
        font-size: 15px;
      }
      .qr-scan small {
        font-size: 12.5px;
        opacity: 0.7;
      }
      .qr-frame {
        position: relative;
        width: 170px;
        height: 170px;
        margin: 0 auto;
        display: grid;
        place-items: center;
        color: rgba(255, 255, 255, 0.35);
        overflow: hidden;
      }
      .qr-frame .c {
        position: absolute;
        width: 30px;
        height: 30px;
        border: 4px solid #7cf0b6;
      }
      .qr-frame .tl {
        left: 0;
        top: 0;
        border-right: 0;
        border-bottom: 0;
        border-radius: 12px 0 0 0;
      }
      .qr-frame .tr {
        right: 0;
        top: 0;
        border-left: 0;
        border-bottom: 0;
        border-radius: 0 12px 0 0;
      }
      .qr-frame .bl {
        left: 0;
        bottom: 0;
        border-right: 0;
        border-top: 0;
        border-radius: 0 0 0 12px;
      }
      .qr-frame .br {
        right: 0;
        bottom: 0;
        border-left: 0;
        border-top: 0;
        border-radius: 0 0 12px 0;
      }
      .tdac-found b {
        display: block;
        font-size: 15px;
      }
      .tdac-found small {
        font-size: 12px;
        color: var(--ink-2);
      }
      .tw-ic.sm {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
      }
      /* --- หน้าเลือกวิธีลงทะเบียน: THIM / TDAC (ดึงข้อมูลอัตโนมัติ) + สมัครใหม่ --- */
      .reg-h {
        text-align: center;
        margin: 36px 0 14px; /* เว้นระยะจากแถบเลือกภาษา */
      }
      .reg-h b {
        display: block;
        font-size: 18px;
        color: var(--navy);
      }
      .reg-h small {
        font-size: 12.5px;
        color: var(--ink-2);
      }
      /* ปุ่มแนวนอนทรงแคปซูล สีตามโลโก้ (แบบหน้าแรกทางรัฐ) */
      .regp {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        height: 54px;
        border-radius: 99px;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .regp img {
        height: 34px;
        width: auto;
        border-radius: 9px;
      }
      .regp.thim {
        background: #0a6fe6;
        box-shadow: 0 6px 16px rgba(10, 111, 230, 0.3);
      }
      .regp.thim img {
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5);
      }
      .regp.tdac {
        background: #0e5393;
        box-shadow: 0 6px 16px rgba(14, 83, 147, 0.3);
      }
      .regp.tdac img {
        border-radius: 0;
      }
      .regs {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        border-radius: 18px;
        background: #fff;
        border: 1.5px solid var(--navy);
        color: var(--navy);
        box-shadow: var(--sh-1);
      }
      .regs .rt-n {
        position: static;
        background: var(--navy);
        color: #fff;
        flex-shrink: 0;
      }
      .regs b {
        display: block;
        font-size: 15.5px;
      }
      .regs small {
        display: block;
        font-size: 12px;
        color: var(--ink-2);
      }
      /* หน้าเลือกวิธีลงทะเบียน: ย่อโลโก้ให้ทุกอย่างพอดีจอ */
      .login-hero .login-logo {
        width: 120px;
      }
      .login-hero h1 {
        font-size: 19px;
      }

      /* ==================================================================
       * 2. วันที่ (DATES)
       *
       * TODAY = วันที่ปัจจุบันจริงของเครื่อง (ตัดเวลาเป็นเที่ยงคืน) — ทุกการคำนวณวันนับจากวันนี้
       * วันที่ในข้อมูลทั้งหมดใช้รูปแบบสตริง ISO 'YYYY-MM-DD'
       * ================================================================== */
      const TODAY = (() => {
        const n = new Date();
        return new Date(n.getFullYear(), n.getMonth(), n.getDate());
      })();
      const TH_M = [
        "ม.ค.",
        "ก.พ.",
        "มี.ค.",
        "เม.ย.",
        "พ.ค.",
        "มิ.ย.",
        "ก.ค.",
        "ส.ค.",
        "ก.ย.",
        "ต.ค.",
        "พ.ย.",
        "ธ.ค.",
      ];
      const EN_M = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      // D(iso)        แปลงสตริง → Date
      // fd(iso)       แสดงวันที่แบบไทย พ.ศ.  เช่น 2 ธ.ค. 2569
      // fde(iso)      แสดงวันที่แบบอังกฤษ ค.ศ. (ใช้ในข้อความสองภาษา)
      // days(iso)     จำนวนวันจากวันนี้ (ติดลบ = เลยมาแล้ว)
      // iso8(date)    แปลง Date → สตริง ISO
      // addDays(iso,n) บวก/ลบวัน
      // inDays(n)     ข้อความ "อีก n วัน" / "วันนี้" / "เลยมา n วัน"
      const D = (iso) => new Date(iso + "T00:00:00");
      const fd = (iso) => {
        if (!iso) return "-";
        const d = D(iso);
        return `${d.getDate()} ${TH_M[d.getMonth()]} ${d.getFullYear() + 543}`;
      };
      const fde = (iso) => {
        const d = D(iso);
        return `${d.getDate()} ${EN_M[d.getMonth()]} ${d.getFullYear()}`;
      };
      const days = (iso) => Math.round((D(iso) - TODAY) / 864e5);
      const iso8 = (d) =>
        `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const addDays = (iso, n) => {
        const d = D(iso);
        d.setDate(d.getDate() + n);
        return iso8(d);
      };
      const inDays = (n) => (n === 0 ? "วันนี้" : n > 0 ? `อีก ${n} วัน` : `เลยมา ${-n} วัน`);

      function runCountdown() {
        const el = document.getElementById("cdNum");

        const from = +el.dataset.from,

          dur = 1200,

          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
        setTimeout(() => (el.textContent = to), dur + 300); // กันพลาด: ให้จบที่ค่าจริงเสมอ
      }
      /* ==================================================================
       * ANIMATION (FX) — แอนิเมชันประกอบการใช้งาน เรียกจาก render() ทุกครั้งหลังวาดหน้า
       *   - เปลี่ยนหน้า: เลื่อนเข้าจากขวา (ไปหน้าถัดไป) / จากซ้าย (ย้อนกลับ) / จางเข้า (สลับแท็บ)
       *   - หน้า Home: การ์ดเลื่อนขึ้นทีละใบ
       *   - stepper: เส้นเติมสีไปยังขั้นใหม่ + วงแสงกระเพื่อม
       *   - วงแหวนเอกสาร: วิ่งจากค่าเดิมไปค่าใหม่
       *   - ผลสแกนพิมพ์ลงช่องทีละตัวอักษร
       *   ทั้งหมดปิดเองเมื่อเครื่องตั้งค่า "ลดการเคลื่อนไหว"
       * ================================================================== */
      const FX = { screen: null, hist: 0, obStep: -1, rings: {}, steps: {}, pop: null };
      const FX_TABS = ["home", "select", "track", "profile"];
      const fxReduce = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      /** เล่นคลาสแอนิเมชันซ้ำได้ (ลบ → reflow → ใส่ใหม่) */
      function fxPlay(el, cls) {
        if (!el) return;
        el.classList.remove(cls);
        void el.offsetWidth;
        el.classList.add(cls);
      }
      function fxAfter() {
        const box = document.getElementById("screen"),
          scr = S.screen;
        // 1) เปลี่ยนหน้า / เปลี่ยนขั้นใน onboarding
        let dir = null;
        if (scr !== FX.screen) {
          if (FX.nav) dir = FX.nav;
          else if (FX_TABS.includes(scr) && FX_TABS.includes(FX.screen)) dir = "fade";
          else if (scr === "home" || FX.screen === null) dir = "fade";
          else if (scr === "login") dir = "back";
          else dir = S.hist.length < FX.hist ? "back" : "fwd";
        } else if (scr === "onboard" && S.ob && S.ob.step !== FX.obStep) dir = S.ob.step > FX.obStep ? "fwd" : "back";
        if (dir && !fxReduce()) {
          box.classList.remove("fx-fwd", "fx-back", "fx-fade");
          fxPlay(box, "fx-" + dir);
        }
        // 2) หน้า Home: การ์ดเลื่อนขึ้นทีละใบ (เฉพาะตอนเข้าหน้า)
        if (scr === "home" && scr !== FX.screen) fxPlay(box.querySelector(".content.home"), "fx-stagger");
        // 4) stepper / รายการสถานะ: ขั้นใหม่ → เส้นเติมสี + วงแสง
        box.querySelectorAll("[data-sig]").forEach((el) => {
          const sig = el.dataset.sig,
            cur = +el.dataset.cur,
            prev = FX.steps[sig];
          if (prev !== undefined && cur > prev) {
            const li = el.children[Math.min(cur, el.children.length - 1)];
            li && li.classList.add("fx-grow");
          }
          FX.steps[sig] = cur;
        });
        // 5) วงแหวนความครบถ้วน: วิ่งจากค่าเดิม (หรือจาก 0 เมื่อเห็นครั้งแรก)
        box.querySelectorAll(".ring-w[data-k]").forEach((el) => {
          const k = el.dataset.k,
            f = +el.dataset.f,
            prev = FX.rings[k] ?? 0,
            c = +el.dataset.c,
            pc = el.querySelector(".prog");
          FX.rings[k] = f;
          if (prev === f || !pc || fxReduce()) return;
          pc.style.transition = "none";
          pc.setAttribute("stroke-dasharray", `${c * prev} ${c}`);
          void pc.getBoundingClientRect();
          pc.style.transition = "stroke-dasharray .7s cubic-bezier(.3,.9,.3,1)";
          requestAnimationFrame(() => pc.setAttribute("stroke-dasharray", `${c * f} ${c}`));
          fxPlay(el, "fx-bump");
        });
        // 6) การ์ดเอกสารที่เพิ่งอัปโหลด → เด้ง
        if (FX.pop) {
          fxPlay(document.getElementById("w_" + FX.pop), "fx-pop");
          FX.pop = null;
        }
        FX.screen = scr;
        FX.nav = null;
        FX.hist = S.hist.length;
        FX.obStep = S.ob ? S.ob.step : -1;
      }
      /** ผลสแกน: ข้อความพิมพ์ลงช่องทีละตัวอักษร + ช่องวันที่/ตัวเลือกกระพริบ */
      function fxType(keys) {
        keys.forEach((k, i) => {
          const w = document.getElementById("w_" + k);
          if (!w) return;
          w.style.setProperty("--i", i);
          fxPlay(w, "fx-scan");
          if (fxReduce()) return;
          const inp = w.querySelector('input:not([type="date"]), textarea');
          if (!inp) return;
          const full = inp.value;
          inp.value = "";
          setTimeout(() => {
            let j = 0;
            const t = setInterval(() => {
              if (!inp.isConnected) return clearInterval(t);
              inp.value = full.slice(0, ++j);
              if (j >= full.length) clearInterval(t);
            }, 32);
          }, i * 220);
        });
      }
      /** เครื่องหมายถูกใหญ่กลางจอ (คำขออนุมัติแล้ว) */
      function fxBigCheck(t) {
        const d = document.createElement("div");
        d.className = "fx-big";
        d.innerHTML = `<div><span>${ic("check", 54)}</span><b>${t}</b></div>`;
        document.getElementById("device").appendChild(d);
        setTimeout(() => d.remove(), 1500);
      }
      /** กระดาษสีโปรยในหน้ายื่นสำเร็จ */
      function fxConfetti(host) {
        if (!host || fxReduce()) return;
        const cols = ["#2fb873", "#2681db", "#ffa41b", "#f5413d", "#014aad", "#7cf0b6"];
        const wrap = document.createElement("div");
        wrap.className = "fx-confetti";
        for (let i = 0; i < 42; i++) {
          const s = document.createElement("i");
          s.style.left = Math.random() * 100 + "%";
          s.style.background = cols[i % cols.length];
          s.style.animationDelay = Math.random() * 0.5 + "s";
          s.style.animationDuration = 1.4 + Math.random() * 1 + "s";
          s.style.setProperty("--r", Math.random() * 720 - 360 + "deg");
          s.style.setProperty("--x", Math.random() * 80 - 40 + "px");
          if (i % 3 === 0) s.style.borderRadius = "50%";
          wrap.appendChild(s);
        }
        host.appendChild(wrap);
        setTimeout(() => wrap.remove(), 3200);
      }
      /** แสดงข้อความแจ้งเตือนสั้น ๆ ด้านล่าง 2.4 วินาที */
      let tt;
      function toast(m) {
        const t = document.getElementById("toast");
        t.textContent = m;
        t.classList.add("show");
        clearTimeout(tt);
        tt = setTimeout(() => t.classList.remove("show"), 2400);
      }

      /* ==================================================================
       * 6. SHARED UI — ชิ้นส่วน HTML ที่ใช้ซ้ำหลายหน้า
       * ================================================================== */
      /**
       * แถบหัวหน้าจอ: ปุ่มย้อนกลับ (ถ้ามีประวัติ) + ชื่อหน้า + ปุ่มช่วยเหลือ
       * o.sub = คำอธิบายใต้ชื่อ, o.back/o.help = false เพื่อซ่อนปุ่ม

      function appbar(title, o = {}) {
        const b = o.back !== false && S.hist.length;
        return `<header class="appbar">${b ? `<button class="iconbtn" onclick="back()" aria-label="ย้อนกลับ">${ic("back", 24)}</button>` : '<span style="width:6px"></span>'}
 <div class="ab-title">${title}${o.sub ? `<small>${o.sub}</small>` : ""}</div>
 ${o.help !== false ? `<button class="iconbtn" onclick="openHelp()" aria-label="ช่วยเหลือ">${ic("help")}</button>` : ""}</header>`;

      /** แถบเมนูล่าง 5 ปุ่ม — a = key ของแท็บที่กำลังเลือก */
      function nav(a) {
        const it = [
          ["home", "home", "หน้าหลัก"],
          ["select", "grid", "บริการ"],
          ["track", "clock", "สถานะ"],

        ];
        return `<nav class="bottomnav">${it.map(([k, i, l]) => `<button class="${a === k ? "on" : ""}" onclick="tab('${k}')">${ic(i, 23)}<span>${l}</span></button>`).join("")}</nav>`;
      }

      /* ==================================================================
       * 7. BUSINESS LOGIC — กฎการคำนวณสิทธิ์ สถานะ และไทม์ไลน์
       *
       * (ส่วนที่ต้องตรวจกับกฎ ตม. จริงก่อนนำไปใช้)
       * ================================================================== */
      /**
       * ตรวจสิทธิ์ยื่นบริการออนไลน์ → { ok, soon, t: หัวข้อ, m: ข้อความ }
       *   ext      : ยื่นได้ภายใน 30 วันก่อนวีซ่าหมดอายุ
       *   report90 : ยื่นได้ล่วงหน้า 15 วัน ถึงเลยกำหนด 7 วัน
       *   บริการอื่น: ยื่นได้เสมอ
       */
      function elig(id) {
        const p = S.p;
        if (id === "ext") {
          const d = days(p.expiry);
          if (d < 0)
            return {
              ok: false,
              t: "วีซ่าหมดอายุแล้ว",
              m: "กรุณาติดต่อสำนักงานตรวจคนเข้าเมืองโดยเร็ว",
            };
          if (d > 30)
            return {
              ok: false,
              soon: true,
              t: "ยังไม่ถึงช่วงยื่นคำขอ",
              m: `ยื่นได้ตั้งแต่ ${fd(addDays(p.expiry, -30))}`,
            };
          return {
            ok: true,
            t: "สามารถยื่นออนไลน์ได้",
            m: `วีซ่าเหลือ ${days(p.expiry)} วัน`,
          };
        }
        if (id === "report90") {
          const d = days(p.report90);
          if (d > 15)
            return {
              ok: false,
              soon: true,
              t: "ยังไม่ถึงช่วงรายงานตัว",
              m:
                `ยื่นได้ตั้งแต่ ${fd(addDays(p.report90, -15))}` +
                (p.trip && p.trip.depart < p.report90
                  ? `\nท่านมีกำหนดเดินทางออกก่อนครบกำหนด รอบนี้อาจไม่ต้องรายงานตัว`
                  : ""),
            };
          if (d < -7)
            return {
              ok: false,
              t: "เกินช่วงรายงานตัวออนไลน์",
              m: "กรุณาติดต่อสำนักงานตรวจคนเข้าเมือง",
            };
          if (d < 0)
            return {
              ok: true,
              late: true,
              t: `เลยกำหนดรายงานตัวมา ${-d} วัน`,
              m: `ครบกำหนด ${fd(p.report90)} · ยังยื่นออนไลน์ได้ถึง ${fd(addDays(p.report90, 7))} หลังจากนั้นต้องไปที่สำนักงาน ตม. และอาจมีค่าปรับ`,
            };
          return {
            ok: true,
            t: "สามารถรายงานตัวออนไลน์ได้",
            m: `ครบกำหนด ${fd(p.report90)} (${inDays(d)})`,
          };
        }
        return { ok: true };
      }
      /** reqOf = คำขอของบริการนี้ที่ยังดำเนินการอยู่, doneOf = คำขอที่เสร็จแล้ว */
      const reqOf = (id) => S.requests.find((r) => r.svc === id && !r.done);
      const doneOf = (id) => S.requests.find((r) => r.svc === id && r.done);
      /** ป้ายสถานะของแต่ละบริการ (แสดงบนการ์ดบริการ) */
      function svcStatus(id) {
        const r = reqOf(id);
        if (r) return `<span class="badge b-blue">กำลังดำเนินการ</span>`;
        const p = S.p;
        if (id === "ext") {
          const d = days(p.expiry);
          return d <= 30
            ? `<span class="badge b-red">วีซ่าเหลือ ${d} วัน</span>`
            : `<span class="badge b-gray">ยื่นได้ ${fd(addDays(p.expiry, -30))}</span>`;
        }
        if (id === "report90") {
          const d = days(p.report90);
          if (d < 0) return `<span class="badge b-red">เลยกำหนด ${-d} วัน</span>`;
          return d <= 15
            ? `<span class="badge b-amber">ครบกำหนด${inDays(d)}</span>`
            : `<span class="badge b-gray">ครบกำหนด ${fd(p.report90)}</span>`;
        }
        if (id === "reentry") {
          if (p.reentryOK) return `<span class="badge b-green">อนุมัติแล้ว</span>`;
          return p.trip
            ? `<span class="badge b-amber">ก่อนเดินทาง ${fd(p.trip.depart)}</span>`
            : `<span class="badge b-gray">ใช้เมื่อจะเดินทางออก</span>`;
        }
        if (id === "tdac") {
          if (p.tdacOK) return `<span class="badge b-green">ได้รับ QR แล้ว</span>`;
          return p.trip
            ? `<span class="badge b-gray">กรอกได้ ${fd(addDays(p.trip.ret, -3))}</span>`
            : `<span class="badge b-gray">ใช้ก่อนเดินทางเข้าไทย</span>`;
        }
        if (id === "tm30") return `<span class="badge b-gray">ใช้เมื่อย้ายที่พัก</span>`;
        return "";
      }
      /**
       * สร้างรายการกำหนดการสำคัญของผู้ใช้ (ต่อวีซ่า, 90 วัน, เดินทาง, จบการศึกษา)
       * ตัดรายการที่ผ่านไปแล้ว และเรียงตามวันที่
       */
      function timeline() {
        const p = S.p,
          t = [];
        t.push({
          d: addDays(p.expiry, -30),
          t: "เริ่มเตรียมเอกสารต่อวีซ่า",
          s: "เตรียมหนังสือรับรองจากมหาวิทยาลัย",
          svc: "ext",
        });
        t.push({
          d: p.report90,
          t: "ครบกำหนดรายงานตัว 90 วัน",
          s: "ยื่นล่วงหน้าได้ 15 วัน",
          svc: "report90",
          done: p.trip && p.trip.depart < p.report90 ? false : undefined,
        });
        t.push({ d: p.expiry, t: "วีซ่าหมดอายุ", s: p.visa, svc: "ext" });
        if (p.trip) {
          t.push({
            d: addDays(p.trip.depart, -1),
            t: "ขอ Re-entry ให้เรียบร้อย",
            s: "ก่อนออกนอกประเทศ",
            svc: "reentry",
            done: !!p.reentryOK,
          });
          t.push({
            d: p.trip.depart,
            t: `เดินทางออก → ${p.trip.dest}`,
            s: "แสดงใบ Re-entry ที่ด่าน",
          });
          t.push({
            d: addDays(p.trip.ret, -3),
            t: "กรอก TDAC ก่อนกลับไทย",
            s: "ภายใน 3 วันก่อนถึงไทย",
            svc: "tdac",
            done: !!p.tdacOK,
          });
          t.push({ d: p.trip.ret, t: "เดินทางกลับถึงไทย", s: "เริ่มนับรายงานตัว 90 วันใหม่" });
        }
        if (p.studyEnd) t.push({ d: p.studyEnd, t: "สิ้นสุดหลักสูตร", s: p.uni });
        return t.filter((x) => days(x.d) >= -1).sort((a, b) => (a.d < b.d ? -1 : 1));
      }
      /**
       * เลือก "สิ่งที่ควรทำตอนนี้" 1 เรื่อง สำหรับกล่องแจ้งเตือนบนหน้า Home
       * ไล่ตามลำดับ recOf(p) แล้วคืนเรื่องแรกที่ถึงเวลา — ถ้าไม่มี แสดง "ทุกอย่างเรียบร้อย"
       */
      /**
       * บริการที่แนะนำ (คำนวณจากวันที่ของผู้ใช้ เรียงตามความเร่งด่วน)
       *   ext เมื่อวีซ่าเหลือ ≤ 60 วัน, report90 เมื่อครบกำหนดใน ≤ 30 วัน (หรือเลยแล้ว), reentry/tdac เมื่อมีแผนเดินทาง
       */
      function recOf(p) {
        const r = [];
        if (p.expiry && days(p.expiry) <= 60) r.push(["ext", days(p.expiry)]);
        if (p.report90 && days(p.report90) <= 30) r.push(["report90", days(p.report90)]);
        if (p.trip) {
          r.push(["reentry", days(p.trip.depart)]);
          r.push(["tdac", days(p.trip.ret)]);
        }
        return r.sort((a, b) => a[1] - b[1]).map((x) => x[0]);
      }
      function topAction() {
        const p = S.p;
        for (const id of recOf(p)) {
          if (reqOf(id) || doneOf(id)) continue;
          const e = elig(id);
          if (id === "ext" && e.ok)
            return {
              c: "red",
              i: "alert",
              t: `วีซ่าจะหมดอายุในอีก ${days(p.expiry)} วัน`,
              m: `หมดอายุวันที่ ${fd(p.expiry)} · กรุณายื่นต่ออายุก่อนวันดังกล่าว`,
              b: "ต่ออายุวีซ่า",
              svc: id,
            };
          if (id === "report90" && e.late)
            return {
              c: "red",
              i: "alert",
              t: `เลยกำหนดรายงานตัว 90 วันมา ${-days(p.report90)} วัน`,
              m: `ยังยื่นออนไลน์ได้ถึง ${fd(addDays(p.report90, 7))} หลังจากนั้นต้องไปที่ ตม.`,
              b: "รายงานตัวตอนนี้",
              svc: id,
            };
          if (id === "report90" && e.ok)
            return {
              c: "amber",
              i: "cal",
              t: `รายงานตัว 90 วัน ${inDays(days(p.report90))}`,
              m: `ครบกำหนด ${fd(p.report90)}`,
              b: "รายงานตัวตอนนี้",
              svc: id,
            };
          if (id === "reentry" && p.trip)
            return {
              c: "amber",
              i: "plane",
              t: `กำหนดเดินทางออก ${fd(p.trip.depart)}`,
              m: "กรุณาขอ Re-entry ก่อนวันเดินทาง",
              b: "ขอ Re-entry",
              svc: id,
            };
          if (id === "tdac" && p.trip)
            return {
              c: "blue",
              i: "globe",
              t: "เตรียม TDAC สำหรับขากลับ",
              m: `กรอกได้ตั้งแต่ ${fd(addDays(p.trip.ret, -3))}`,
              b: "ดูรายละเอียด",
              svc: id,
            };
        }
        return {
          c: "green",
          i: "shield",
          t: "ทุกอย่างเรียบร้อย",
          m: "ไม่มีรายการที่ต้องดำเนินการ",
          b: null,
        };
      }

      /* ==================================================================
       * 8. ACTIONS — ฟังก์ชันที่ปุ่มต่าง ๆ เรียก (เปลี่ยน state แล้ว render)
       * ================================================================== */
      /* ---------- เข้าสู่ระบบ / สมัครใหม่ (จำลอง) ----------
         S.auth.mode : 'thim' = ลงชื่อเข้าใช้ผ่าน THIM | 'signup' = สมัครใหม่
         S.auth.via  : (THIM) 'app' ยืนยันผ่านแอป THIM ในเครื่อง | 'email' กรอกเลขพาสปอร์ตแล้วรับ OTP ทางอีเมล
         OTP สำหรับทดลองคือ 123456 */
      const DEMO_OTP = "123456";
      const maskEmail = (e) => {
        const [u, d] = String(e).split("@");
        return u ? `${u[0]}${"•".repeat(Math.max(3, u.length - 1))}@${d}` : "";
      };
      /** เริ่มเข้าสู่ระบบตามวิธีที่เลือก */
      function authStart(mode) {

      /* ---------- ONBOARDING (ตั้งค่าบัญชีครั้งแรก 5 ขั้น) ----------

      const OB_STEP_KEYS = [

      /** ผลการสแกน (จำลอง): passport = หน้าข้อมูลหนังสือเดินทาง (MRZ), visa = หน้าวีซ่า/ตราประทับ */
      const SCAN_KEYS = {

      /** คำนวณวันครบรายงานตัว 90 วันจากวันเริ่มอนุญาต (รอบถัดไปที่ยังไม่เลยกำหนดเกิน 7 วัน) */

       * วันครบกำหนดรายงานตัว 90 วันครั้งถัดไป = วันที่เข้าไทย + 90 วัน ไปเรื่อย ๆ
       * จนถึงรอบที่ยังไม่เลยกำหนดเกิน 7 วัน (ช่วงที่ยังรายงานตัวออนไลน์ได้) → { d: วันที่, n: รอบที่ }

      function calc90(arrival) {

          S.screen = "home";
          render(true);
          toast("ยืนยันข้อมูลเรียบร้อย");
        } else {
          toast("บันทึกข้อมูลแล้ว");
          render();
        }
      }
      /**
       * เปิดบริการ: เตรียมฟอร์ม (ค่าเริ่มต้นจาก fields) และสถานะเอกสารแต่ละรายการ
       * ถ้ากลับมาบริการเดิม จะคงข้อมูลที่กรอกไว้
       */
      function openSvc(id) {
        if (S.svc !== id || !S.form._init) {
          S.svc = id;
          S.form = { _init: 1 };
          SV[id].fields(S.p).forEach((f) => (S.form[f.id] = f.v));
          S.errors = {};
          S.agree = false;
          S.docs = {};
          SV[id].docs.forEach((k) => {
            const d = DOCS[k];
            S.docs[k] = d.auto
              ? "auto"
              : S.p.wallet.includes(k)
                ? "wallet"
                : S.p.uploads[k]
                  ? "upload"
                  : d.opt
                    ? "opt"
                    : "miss";
          });
        }
        go("form");
      }
      /** บันทึกค่าที่ผู้ใช้กรอก และลบข้อความ error ของช่องนั้นทันที (ไม่ต้อง render ใหม่ทั้งหน้า) */
      function setF(id, v) {
        S.form[id] = v;
        if (S.errors[id]) {
          delete S.errors[id];
          const w = document.getElementById("w_" + id);
          if (w) {
            w.classList.remove("err");
            w.querySelector(".errmsg")?.remove();
          }
        }
        if (S.svc === "report90" && id === "stay") render(); // แสดง/ซ่อนช่องที่อยู่
      }
      /** ตรวจความถูกต้องของฟอร์ม (ช่องบังคับ + กฎเฉพาะบริการ) ถ้าผ่านไปหน้า Check */
      function toChecklist() {
        const fs = SV[S.svc].fields(S.p);
        S.errors = {};
        fs.filter((f) => f.type === "ro").forEach((f) => (S.form[f.id] = f.v)); // ค่าล่าสุดจากข้อมูลส่วนตัว
        fs.forEach((f) => {
          if (f.req && !String(S.form[f.id] ?? "").trim()) S.errors[f.id] = "กรุณากรอกข้อมูลนี้";
        });
        if (S.svc === "reentry" && S.form.depart && S.form.ret && S.form.ret <= S.form.depart)
          S.errors.ret = "วันเดินทางกลับต้องอยู่หลังวันเดินทางออก";
        if (S.svc === "reentry" && S.form.depart && S.form.depart < iso8(TODAY))
          S.errors.depart = "วันเดินทางออกต้องไม่ใช่วันที่ผ่านมาแล้ว";
        if (S.svc === "report90" && S.form.ownerPhone && !/^0\d{8,9}$/.test(S.form.ownerPhone.replace(/[\s-]/g, "")))
          S.errors.ownerPhone = "ใช้เบอร์ในไทย เช่น 089-000-1122";
        if (S.svc === "report90" && S.form.stay === "ย้ายที่พักแล้ว") {
          S.errors.stay = "กรุณาแจ้งที่พัก (ตม.30) ให้เรียบร้อยก่อนรายงานตัว";
        }
        const k = Object.keys(S.errors);
        if (k.length) {
          render();
          toast(`กรุณาตรวจสอบข้อมูล ${k.length} รายการ`);
          const el = document.getElementById("w_" + k[0]);
          el && el.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        go("check");
      }
      /**
       * จัดการเอกสารที่ยังขาด: 'upload' อัปโหลดทันที
       * 'univ' / 'owner' → สถานะ wait แล้วจำลองว่าได้รับเอกสารใน 2.2 วินาที
       */
      function docAct(k, a) {
        if (a === "upload") {
          S.docs[k] = "upload";
          S.p.uploads[k] = true;
          if (!S.p.wallet.includes(k)) S.p.wallet.push(k);
          if (k === "tm30_receipt") gotTm30();
          toast("อัปโหลดเอกสารแล้ว (จำลอง) · บันทึกใน Wallet");
          render();
        }
        if (a === "owner") {
          S.docs[k] = "wait";
          render();
          toast("ส่งคำขอเอกสารถึงเจ้าของที่พักแล้ว");
          setTimeout(() => {
            S.docs[k] = "owner";
            if (S.screen === "check" || S.screen === "form") render();
            toast("เจ้าของที่พักส่งเอกสารแล้ว");
          }, 2200);
        }
      }
      /** สถานะเอกสารที่ถือว่า "พร้อมแล้ว" */
      const docReady = (v) => ["auto", "wallet", "upload", "univ", "owner", "opt"].includes(v);
      /** ส่งคำขอ: สร้างหมายเลขอ้างอิง (TR-XXX-69xxxx) เพิ่มลง S.requests แล้วแสดง modal */
      function submit() {
        const sv = SV[S.svc];
        const id =
          "TR-" +
          S.svc.slice(0, 3).toUpperCase() +
          "-69" +
          String(Math.floor(Math.random() * 90000) + 10000);
        S.requests.unshift({
          id,
          svc: S.svc,
          step: 1,
          steps: sv.track,
          date: iso8(TODAY),
          done: false,
          form: { ...S.form },
        });
        S.form = {};
        S.modal = { id, svc: S.svc };
        showModal();
      }
      /** (ปุ่มเดโม) เลื่อนสถานะคำขอไปขั้นถัดไป — ครบทุกขั้นแล้วเรียก applyDone() */
      function advance(rid) {
        const r = S.requests.find((x) => x.id === rid);
        if (!r || r.done) return;
        r.step++;
        if (r.step >= r.steps.length) {
          r.done = true;
          applyDone(r);
        } else toast(`อัปเดตสถานะ: ${r.steps[r.step - 1]}`);
        render();
        if (r.done) fxBigCheck(r.steps[r.steps.length - 1]);
      }
      /** เมื่อคำขอเสร็จ อัปเดตข้อมูลผู้ใช้ตามผลลัพธ์ เช่น ขยายวันหมดอายุวีซ่า +365 วัน, เลื่อนกำหนด 90 วัน */
      function applyDone(r) {
        const p = S.p;
        let m = "";
        if (r.svc === "ext") {
          p.stayStart = p.expiry;
          p.expiry = addDays(p.expiry, 365);
          m = `วีซ่าขยายถึง ${fd(p.expiry)} แล้ว`;
        }
        if (r.svc === "report90") {
          p.report90 = addDays(p.report90, 90);
          m = `รายงานตัวครั้งถัดไป ${fd(p.report90)}`;
        }
        if (r.svc === "reentry") {
          p.reentryOK = true;
          m = "ได้รับ Re-entry Permit แล้ว";
        }
        if (r.svc === "tdac") {
          p.tdacOK = true;
          m = "ได้รับ QR TDAC แล้ว";
        }
        if (r.svc === "tm30") {
          if (!p.wallet.includes("tm30_receipt")) p.wallet.push("tm30_receipt");
          m = "ได้รับใบรับแจ้งที่พัก (ตม.30) เก็บใน Wallet แล้ว";
        }
        r.result = m;
        toast("เสร็จสิ้น · " + m + " อัปเดตในแอปทันที");
      }
      /** ยืนยันนัดหมาย ตม. (ต้องเลือกวันและเวลาก่อน) */
      function book() {
        if (!S.apDate || !S.apTime) {
          toast("กรุณาเลือกวันและเวลา");
          return;
        }
        S.appt = { d: S.apDate, t: S.apTime };
        render();
        toast("ยืนยันนัดหมายเรียบร้อยแล้ว");
      }
      /** คัดลอกข้อความสองภาษาถึงเจ้าของที่พัก (บริการ ตม.30) */

      /* ==================================================================
       * 9. SCREENS — แต่ละหน้าคือฟังก์ชันที่คืนค่าเป็นสตริง HTML
       *
       * render() จะเรียก SCREENS[S.screen]() แล้วใส่ผลลัพธ์ลงใน #screen
       *
       *   login → profile → home → select → form → check → (modal) → track
       * ================================================================== */
      const SCREENS = {};

      /* ---------- UI ช่วยแสดงผล (ดีไซน์เท่านั้น ไม่ใช่ข้อมูลหรือกฎ) ----------
         UI : สถานะการแสดงผลชั่วคราว เช่น แท็บที่เลือก กลุ่มที่ยุบ/กาง — แยกจาก S เพื่อไม่ยุ่งกับ state หลัก */
      const UI = {
        trackTab: "active", // แท็บในหน้าสถานะ: active | done
        remOpen: false, // กางตั้งค่าแจ้งเตือน
        docsOpen: false, // กางรายการเอกสารในหน้าฟอร์ม
        readyOpen: true, // กางกลุ่ม "พร้อมแล้ว" ในหน้าตรวจเอกสาร
        profOpen: null, // หมวดที่กางในหน้าของฉัน ('_none' = ปิดทั้งหมด)
      };
      function uiSet(k, v) {
        UI[k] = v;
        render();
      }
      /** เลื่อนไปยัง element ตาม id (ใช้กับปุ่มลัดในหน้า) */
      function jump(id) {
        const el = document.getElementById(id);
        el && el.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      /** stepper แนวนอน: labels = ชื่อขั้นจากข้อมูลเดิม, cur = index ขั้นปัจจุบัน, all = เสร็จทุกขั้น */
      function stepper(labels, cur, all) {
        return `<ol class="stp" data-sig="${esc(labels.join("|"))}" data-cur="${all ? labels.length : cur}">${labels
          .map((t, i) => {
            const c = all || i < cur ? "done" : i === cur ? "now" : "";
            return `<li class="${c}"><span class="stp-d">${c === "done" ? ic("check", 14) : i + 1}</span><span class="stp-t">${t}</span></li>`;
          })
          .join("")}</ol>`;
      }
      /** วงแหวนความครบถ้วน ok/total */
      function ring(ok, total, size = 48, key) {
        const r = 15.5,
          c = 2 * Math.PI * r,
          f = total ? ok / total : 0;
        const col = f >= 1 ? "var(--green)" : "var(--orange)";
        return `<span class="ring-w" ${key ? `data-k="${key}" data-f="${f}" data-c="${c}"` : ""} style="width:${size}px;height:${size}px"><svg viewBox="0 0 36 36" width="${size}" height="${size}"><circle cx="18" cy="18" r="${r}" fill="none" stroke="var(--blue-50)" stroke-width="3.5"/><circle class="prog" cx="18" cy="18" r="${r}" fill="none" stroke="${col}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${c * f} ${c}" transform="rotate(-90 18 18)"/></svg><b style="font-size:${Math.round(size / 3.6)}px">${ok}/${total}</b></span>`;
      }
      /** ปิดบางหลักของเลขหนังสือเดินทาง */
      const mask = (s) => String(s).slice(0, 2) + "•••••" + String(s).slice(-2);
      /** ลาย QR ตกแต่ง (สร้างจากตัวอักษรเลขพาสปอร์ต) — ไม่ใช่ QR ที่สแกนได้จริง */
      function qrDeco(seed) {
        let h = 7,
          cells = "";
        for (let y = 0; y < 9; y++)
          for (let x = 0; x < 9; x++) {
            const corner = (x < 3 && y < 3) || (x > 5 && y < 3) || (x < 3 && y > 5);
            h = (h * 31 + seed.charCodeAt((x + y * 9) % seed.length)) % 997;
            const hole = (x === 1 || x === 7) && (y === 1 || y === 7);
            if (corner ? !hole : h % 3 === 0)
              cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
          }
        return `<svg viewBox="-0.5 -0.5 10 10" width="100%" height="100%" fill="var(--navy)">${cells}</svg>`;
      }
      /** การ์ดกำหนดการแบบเลื่อนแนวนอน (หน้าสถานะ) — สีขอบบนตามความเร่งด่วน */
      function tlCard(x) {
        const d = D(x.d),
          n = days(x.d);
        const u = x.done ? "ok" : n <= 7 ? "red" : n <= 30 ? "amber" : "gray";
        const b = x.done ? "b-green" : n <= 7 ? "b-red" : n <= 30 ? "b-amber" : "b-gray";
        return `<div class="tlc ${u}"><div class="tlc-d"><b>${d.getDate()}</b> ${TH_M[d.getMonth()]}</div><b class="tlc-t">${x.t}</b><small>${x.s || ""}</small><span class="badge ${b}">${x.done ? "เสร็จแล้ว" : inDays(n)}</span></div>`;
      }
      /** ค้นหาบริการในหน้า "บริการทั้งหมด" (กรองที่หน้าจอ ไม่เปลี่ยนข้อมูล) */
      function filterSvc(q) {
        q = q.trim().toLowerCase().replace(/\s+/g, "");
        let n = 0;
        document.querySelectorAll("[data-q]").forEach((el) => {
          const hit = !q || el.dataset.q.toLowerCase().replace(/\s+/g, "").includes(q);
          el.style.display = hit ? "" : "none";
          if (hit && el.classList.contains("tile")) n++;
        });
        document.querySelectorAll(".rec-sec").forEach((s) => {
          s.style.display = [...s.querySelectorAll("[data-q]")].some((e) => e.style.display !== "none") ? "" : "none";
        });
        const nr = document.getElementById("noRes");
        if (nr) nr.style.display = n ? "none" : "";
      }

      /* ---------- หน้า LANDING : หน้าแรกของแอปทางรัฐ ----------
         ส่วนคนไทย (ลงทะเบียน / เข้าสู่ระบบ / ThaID) เป็นปุ่มจำลอง — ต้นแบบนี้สาธิตเฉพาะส่วนชาวต่างชาติ

      SCREENS.landing = () => `<div class="land">
 <div class="land-art-w"><img class="land-art" src="${LAND_ART}" alt=""></div>
 <h1 class="land-h">ติดต่อรัฐ<br>ง่ายแค่ปลายนิ้ว</h1>
 <button class="land-btn reg" onclick="landTH()">ลงทะเบียน</button>
 <div class="land-or">หรือ</div>
 <button class="land-btn in" onclick="landTH()">เข้าสู่ระบบ</button>
 <button class="land-btn thaid" onclick="landTH()"><img class="thaid-b" src="${THAID_LOGO}" alt="ThaID">เข้าสู่ระบบด้วย ThaID</button>
 <div class="land-or fx">สำหรับชาวต่างชาติ · For foreigners</div>
 <button class="land-fx" onclick="go('login')"><span class="lfx-ic">${ic("globe", 24)}</span><span class="lfx-t"><b>ชาวต่างชาติในประเทศไทย <span class="badge b-leaf">ใหม่</span></b><small>Foreigners in Thailand · 外国人</small></span>${ic("chev", 20)}</button>
 <div class="land-safe">${ic("help", 18)}เรารักษาความปลอดภัยของข้อมูลของคุณ</div>
 </div>`;

      /* ---------- หน้า LOGIN : เลือกวิธีเข้าสู่ระบบ (THIM / สมัครใหม่) ---------- */
      SCREENS.login = () => `<div class="content">
 <button class="iconbtn login-back" onclick="toLanding()" aria-label="กลับหน้าแรก">${ic("back", 24)}</button>
 <div class="login-hero"><img class="login-logo" src="${LOGO}" alt="ทางรัฐ"><h1>บริการนักศึกษาต่างชาติ</h1><p>วีซ่าและการพำนักในไทย</p><span class="proto-tag">ต้นแบบ · ข้อมูลจำลอง</span></div>
 <div class="lang">${["ไทย", "English", "中文"].map((l, i) => `<button class="chip ${i ? "" : "on"}" onclick="toast('ต้นแบบนี้แสดงผลภาษาไทย')">${l}</button>`).join("")}</div>
 <div class="reg-h"><b>เลือกวิธีลงทะเบียน</b></div>
 <button class="regp thim" onclick="authStart('thim')"><img src="${THIM_LOGO}" alt="THIM">ลงชื่อเข้าใช้ด้วย THIM</button>
 <button class="regp tdac" onclick="authStart('tdac')"><img src="${TDAC_BADGE}" alt="TDAC">ดึงข้อมูลจาก TDAC</button>
 <div class="land-or">หรือ</div>
 <button class="regs" onclick="authStart('signup')"><span class="ao-ic">${ic("user", 24)}</span><b class="sp">สมัครใช้งานใหม่</b>${ic("chev", 20)}</button>
 <div class="login-note">${ic("shield", 16)}<span>ยืนยันตัวตนด้วยรหัส OTP ทางอีเมล ไม่ใช้ SMS เพราะหลายคนเปลี่ยนเบอร์มือถือเมื่อมาอยู่ไทย</span></div>
 </div>`;

      /* ---------- หน้า AUTH : ยืนยันตัวตน (THIM ผ่านแอป / OTP ทางอีเมล, สมัครใหม่ด้วยอีเมล) ---------- */
      SCREENS.auth = () => {
        const a = S.auth,
          e = a.err;
        const fld = (k, l, o = {}) =>
          `<div class="field ${e[k] ? "err" : ""}" id="a_${k}"><label>${l}</label><input ${o.type ? `type="${o.type}"` : ""} ${o.im ? `inputmode="${o.im}"` : ""} ${o.max ? `maxlength="${o.max}"` : ""} value="${esc(a[k])}" placeholder="${o.ph || ""}" oninput="authSet('${k}',this.value)" autocomplete="off">${e[k] ? `<div class="errmsg">${ic("alert", 14)} ${e[k]}</div>` : ""}${o.hint ? `<div class="hint">${o.hint}</div>` : ""}</div>`;
        const otpBox = (to) => `<div class="otp-sent">${ic("mail", 18)}<span>ส่งรหัส 6 หลักไปที่ <b>${maskEmail(to)}</b> แล้ว</span></div>
  ${fld("otp", "รหัส OTP", { im: "numeric", max: 6, ph: "••••••", hint: "รหัสสำหรับทดลอง: 123456" })}
  <div class="flex" style="justify-content:space-between"><a class="lnk" onclick="authSendOtp()">ส่งรหัสอีกครั้ง</a><a class="lnk" onclick="S.auth.otp='123456';render()">${ic("spark", 14)} ใส่รหัสทดลอง</a></div>`;
        let body, cta;
        if (a.mode === "tdac") {
          const done = a.qr === "done";
          body = `<div class="card float thim-head"><span class="tdac-logo lg"><img src="${TDAC_BADGE}" alt="TDAC"></span><div class="sp"><b>ดึงข้อมูลจาก TDAC</b><small>ใช้ QR Code จากใบยืนยัน Thailand Digital Arrival Card ที่ได้ทางอีเมลหลังกรอก TDAC ก่อนเดินทางเข้าไทย</small></div></div>
  ${
    done
      ? `<div class="card mt12 tdac-found"><div class="flex" style="gap:10px"><span class="tw-ic sm">${ic("check", 20)}</span><div class="sp"><b>พบข้อมูล TDAC</b><small>${TDAC_META.no} · ${TDAC_META.flight}</small></div></div>
  <div class="mt8">${TDAC_FIELDS.slice(0, 4).map(([k, l]) => `<div class="kv"><span>${l}</span><b>${k === "dob" ? fd(SAMPLE[k]) : esc(SAMPLE[k])}</b></div>`).join("")}<div class="kv"><span>วันที่เดินทางเข้าไทย</span><b>${fd(SAMPLE.arrivalDate)}</b></div></div>

       * แสดงจุด "กำลังพิมพ์" 0.7 วินาทีก่อนตอบ

      function ask(k, free) {
        const h = S.help;
        // กันคำตอบซ้อน: ระหว่าง AI กำลังพิมพ์ ไม่รับคำถามใหม่
        if (h.typing) return;
        // คำถามสำเร็จรูปที่ถามไปแล้ว ไม่ต้องถามซ้ำ (เช่น กดการ์ดบนหน้า Home หลายครั้ง)
        if (!free && h.chat.some((m) => m.me && m.t === QA[k].q)) return;
        let a;
        if (free) {
          h.chat.push({ me: 1, t: free });
          const s = free.toLowerCase();
          a =
            /90/.test(s) && /(ต่ออายุ|ต่อวีซ่า|extend)/.test(s)
              ? QA.diff.a
              : /re-?entry|ออกนอก|กลับบ้าน/.test(s)
                ? QA.reentry.a
                : /ย้าย|ตม\.?30|tm\.?30|ที่พัก/.test(s)
                  ? QA.move.a
                  : /ต่ออายุ|ต่อวีซ่า|หมดอายุ|extend/.test(s)
                    ? QA.when.a
                    : /90/.test(s)
                      ? QA.diff.a

        } else {
          h.chat.push({ me: 1, t: QA[k].q });
          a = QA[k].a;
        }
        h.typing = true;
        renderSheet();
        setTimeout(() => {
          h.typing = false;
          h.chat.push({ t: a });
          renderSheet();
        }, 700);
      }
