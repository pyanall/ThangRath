          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
        setTimeout(() => (el.textContent = to), dur + 300); // กันพลาด: ให้จบที่ค่าจริงเสมอ
      }
      /** แสดงข้อความแจ้งเตือนสั้น ๆ ด้านล่าง 2.4 วินาที */
      let tt;
      function toast(m) {
        const t = document.getElementById("toast");
        t.textContent = m;
        t.classList.add("show");
        clearTimeout(tt);
        tt = setTimeout(() => t.classList.remove("show"), 2400);
      }

      /* ==================================================================
       * 6. SHARED UI — ชิ้นส่วน HTML ที่ใช้ซ้ำหลายหน้า
       * ================================================================== */
      /**
       * แถบหัวหน้าจอ: ปุ่มย้อนกลับ (ถ้ามีประวัติ) + ชื่อหน้า + ปุ่มช่วยเหลือ
       * o.sub = คำอธิบายใต้ชื่อ, o.back/o.help = false เพื่อซ่อนปุ่ม
       */
      function appbar(title, o = {}) {
        const b = o.back !== false && S.hist.length;
        return `<header class="appbar">${b ? `<button class="iconbtn" onclick="back()" aria-label="ย้อนกลับ">${ic("back", 24)}</button>` : '<span style="width:6px"></span>'}
 <div class="ab-title">${title}${o.sub ? `<small>${o.sub}</small>` : ""}</div>
 ${o.help !== false ? `<button class="iconbtn" onclick="openHelp()" aria-label="ช่วยเหลือ">${ic("help")}</button>` : ""}</header>`;
      }
      /** แถบเมนูล่าง 5 ปุ่ม — a = key ของแท็บที่กำลังเลือก */
      function nav(a) {
        const it = [
          ["home", "home", "หน้าหลัก"],
          ["profile", "user", "ของฉัน"],
          ["select", "grid", "บริการ"],
          ["track", "clock", "สถานะ"],
          ["help", "help", "ช่วยเหลือ"],
        ];
        return `<nav class="bottomnav">${it.map(([k, i, l]) => `<button class="${a === k ? "on" : ""}" onclick="tab('${k}')">${ic(i, 23)}<span>${l}</span></button>`).join("")}</nav>`;
      }

      /* ==================================================================
       * 7. BUSINESS LOGIC — กฎการคำนวณสิทธิ์ สถานะ และไทม์ไลน์
       *
       * (ส่วนที่ต้องตรวจกับกฎ ตม. จริงก่อนนำไปใช้)
       * ================================================================== */
      /**
       * ตรวจสิทธิ์ยื่นบริการออนไลน์ → { ok, soon, t: หัวข้อ, m: ข้อความ }
       *   ext      : ยื่นได้ภายใน 30 วันก่อนวีซ่าหมดอายุ
       *   report90 : ยื่นได้ล่วงหน้า 15 วัน ถึงเลยกำหนด 7 วัน
       *   บริการอื่น: ยื่นได้เสมอ
       */
      function elig(id) {
        const p = S.p;
        if (id === "ext") {
          const d = days(p.expiry);
          if (d < 0)
            return {
              ok: false,
              t: "วีซ่าหมดอายุแล้ว",
              m: "กรุณาติดต่อสำนักงานตรวจคนเข้าเมืองโดยเร็ว",
            };
          if (d > 30)
            return {
              ok: false,
              soon: true,
              t: "ยังไม่ถึงช่วงยื่นคำขอ",
              m: `ยื่นได้ตั้งแต่ ${fd(addDays(p.expiry, -30))}`,
            };
          return {
            ok: true,
            t: "สามารถยื่นออนไลน์ได้",
            m: `วีซ่าเหลือ ${days(p.expiry)} วัน`,
          };
        }
        if (id === "report90") {
          const d = days(p.report90);
          if (d > 15)
            return {
              ok: false,
              soon: true,
              t: "ยังไม่ถึงช่วงรายงานตัว",
              m:
                `ยื่นได้ตั้งแต่ ${fd(addDays(p.report90, -15))}` +
                (p.trip && p.trip.depart < p.report90
                  ? `\nท่านมีกำหนดเดินทางออกก่อนครบกำหนด รอบนี้อาจไม่ต้องรายงานตัว`
                  : ""),
            };
          if (d < -7)
            return {
              ok: false,
              t: "เกินช่วงรายงานตัวออนไลน์",
              m: "กรุณาติดต่อสำนักงานตรวจคนเข้าเมือง",
            };
          return {
            ok: true,
            t: "สามารถรายงานตัวออนไลน์ได้",
            m: `ครบกำหนด ${fd(p.report90)} (${inDays(d)})`,
          };
        }
        return { ok: true };
      }
      /** reqOf = คำขอของบริการนี้ที่ยังดำเนินการอยู่, doneOf = คำขอที่เสร็จแล้ว */
      const reqOf = (id) => S.requests.find((r) => r.svc === id && !r.done);
      const doneOf = (id) => S.requests.find((r) => r.svc === id && r.done);
      /** ป้ายสถานะของแต่ละบริการ (แสดงบนการ์ดบริการ) */
      function svcStatus(id) {
        const r = reqOf(id);
        if (r) return `<span class="badge b-blue">กำลังดำเนินการ</span>`;
        const p = S.p;
        if (id === "ext") {
          const d = days(p.expiry);
          return d <= 30
            ? `<span class="badge b-red">วีซ่าเหลือ ${d} วัน</span>`
            : `<span class="badge b-gray">ยื่นได้ ${fd(addDays(p.expiry, -30))}</span>`;
        }
        if (id === "report90") {
          const d = days(p.report90);
          return d <= 15
            ? `<span class="badge b-amber">ครบกำหนด${inDays(d)}</span>`
            : `<span class="badge b-gray">ครบกำหนด ${fd(p.report90)}</span>`;
        }
        if (id === "reentry") {
          if (p.reentryOK) return `<span class="badge b-green">อนุมัติแล้ว</span>`;
          return p.trip
            ? `<span class="badge b-amber">ก่อนเดินทาง ${fd(p.trip.depart)}</span>`
            : `<span class="badge b-gray">ใช้เมื่อจะเดินทางออก</span>`;
        }
        if (id === "tdac") {
          if (p.tdacOK) return `<span class="badge b-green">ได้รับ QR แล้ว</span>`;
          return p.trip
            ? `<span class="badge b-gray">กรอกได้ ${fd(addDays(p.trip.ret, -3))}</span>`
            : `<span class="badge b-gray">ใช้ก่อนเดินทางเข้าไทย</span>`;
        }
        if (id === "tm30") return `<span class="badge b-gray">ใช้เมื่อย้ายที่พัก</span>`;
        return "";
      }
      /**
       * สร้างรายการกำหนดการสำคัญของผู้ใช้ (ต่อวีซ่า, 90 วัน, เดินทาง, จบการศึกษา)
       * ตัดรายการที่ผ่านไปแล้ว และเรียงตามวันที่
       */
      function timeline() {
        const p = S.p,
          t = [];
        t.push({
          d: addDays(p.expiry, -30),
          t: "เริ่มเตรียมเอกสารต่อวีซ่า",
          s: "ขอหนังสือรับรองมหาวิทยาลัย",
          svc: "ext",
        });
        t.push({
          d: p.report90,
          t: "ครบกำหนดรายงานตัว 90 วัน",
          s: "ยื่นล่วงหน้าได้ 15 วัน",
          svc: "report90",
          done: p.trip && p.trip.depart < p.report90 ? false : undefined,
        });
        t.push({ d: p.expiry, t: "วีซ่าหมดอายุ", s: p.visa, svc: "ext" });
        if (p.trip) {
          t.push({
            d: addDays(p.trip.depart, -1),
            t: "ขอ Re-entry ให้เรียบร้อย",
            s: "ก่อนออกนอกประเทศ",
            svc: "reentry",
            done: !!p.reentryOK,
          });
          t.push({
            d: p.trip.depart,
            t: `เดินทางออก → ${p.trip.dest}`,
            s: "แสดงใบ Re-entry ที่ด่าน",
          });
          t.push({
            d: addDays(p.trip.ret, -3),
            t: "กรอก TDAC ก่อนกลับไทย",
            s: "ภายใน 3 วันก่อนถึงไทย",
            svc: "tdac",
            done: !!p.tdacOK,
          });
          t.push({ d: p.trip.ret, t: "เดินทางกลับถึงไทย", s: "เริ่มนับรายงานตัว 90 วันใหม่" });
        }
        t.push({ d: p.studyEnd, t: "สิ้นสุดหลักสูตร", s: p.uni });
        return t.filter((x) => days(x.d) >= -1).sort((a, b) => (a.d < b.d ? -1 : 1));
      }
      /**
       * เลือก "สิ่งที่ควรทำตอนนี้" 1 เรื่อง สำหรับกล่องแจ้งเตือนบนหน้า Home
       * ไล่ตามลำดับ p.rec แล้วคืนเรื่องแรกที่ถึงเวลา — ถ้าไม่มี แสดง "ทุกอย่างเรียบร้อย"
       */
      function topAction() {
        const p = S.p;
        for (const id of p.rec) {
          if (reqOf(id) || doneOf(id)) continue;
          const e = elig(id);
          if (id === "ext" && e.ok)
            return {
              c: "red",
              i: "alert",
              t: `วีซ่าจะหมดอายุในอีก ${days(p.expiry)} วัน`,
              m: `หมดอายุวันที่ ${fd(p.expiry)} · กรุณายื่นต่ออายุก่อนวันดังกล่าว`,
              b: "ต่ออายุวีซ่า",
              svc: id,
            };
          if (id === "report90" && e.ok)
            return {
              c: "amber",
              i: "cal",
              t: `รายงานตัว 90 วัน ${inDays(days(p.report90))}`,
              m: `ครบกำหนด ${fd(p.report90)}`,
              b: "รายงานตัวตอนนี้",
              svc: id,
            };
          if (id === "reentry" && p.trip)
            return {
              c: "amber",
              i: "plane",
              t: `กำหนดเดินทางออก ${fd(p.trip.depart)}`,
              m: "กรุณาขอ Re-entry ก่อนวันเดินทาง",
              b: "ขอ Re-entry",
              svc: id,
            };
          if (id === "tdac" && p.trip)
            return {
              c: "blue",
              i: "globe",
              t: "เตรียม TDAC สำหรับขากลับ",
              m: `กรอกได้ตั้งแต่ ${fd(addDays(p.trip.ret, -3))}`,
              b: "ดูรายละเอียด",
              svc: id,
            };
        }
        return {
          c: "green",
          i: "shield",
          t: "ทุกอย่างเรียบร้อย",
          m: "ไม่มีรายการที่ต้องดำเนินการ",
          b: null,
        };
      }

      /* ==================================================================
       * 8. ACTIONS — ฟังก์ชันที่ปุ่มต่าง ๆ เรียก (เปลี่ยน state แล้ว render)
       * ================================================================== */
      /** เข้าสู่ระบบ (จำลอง): ตรวจเลขพาสปอร์ต + OTP 6 หลัก แล้วคัดลอกข้อมูล persona มาเป็น S.p */
      function doLogin() {
        const pass = (S.loginPass ?? PERSONAS[S.loginPick].passport).trim(),
          otp = (S.loginOtp ?? "123456").trim();
        if (!pass) {
          toast("กรุณากรอกเลขหนังสือเดินทาง");
          return;
        }
        if (!/^\d{6}$/.test(otp)) {
          toast("รหัส OTP ต้องเป็นตัวเลข 6 หลัก");
          return;
        }
        S.p = JSON.parse(JSON.stringify(PERSONAS[S.loginPick]));
        // ดึงจาก ตม. เฉพาะข้อมูลพื้นฐาน — ส่วนที่ผู้ใช้ต้องกรอกเอง/อัปโหลดเอง ให้เริ่มจากค่าว่าง
        OB_FILL.forEach((k) => (S.p[k] = ""));
        S.p.wallet = [];
        S.p.uploads = {};
        S.ob = { step: 0, src: S.loginPick, err: {}, up: {} };
        S.cdDone = false;
        S.confirmed = false;
        S.requests = [];
        S.appt = null;
        S.help.chat = [];
        S.event = "all";
        // ล้างงานค้างของผู้ใช้คนก่อน (กันข้อมูลข้ามผู้ใช้)
        S.svc = null;
        S.form = {};
        S.errors = {};
        S.docs = {};
        S.agree = false;
        S.apDate = null;
        S.apTime = null;
        Object.assign(UI, { trackTab: "active", remOpen: false, docsOpen: false, readyOpen: true, profOpen: null, lastSvc: null });
        S.hist = [];
        S.screen = "onboard";
        render(true);
        toast("เข้าสู่ระบบสำเร็จ · ดึงข้อมูลจาก ตม. แล้ว");
      }
      /* ---------- ONBOARDING (ตั้งค่าบัญชีครั้งแรก) ----------
         หลังล็อกอิน ระบบดึงเฉพาะข้อมูลพื้นฐานจาก ตม. ส่วนที่เหลือผู้ใช้กรอกเอง แล้วอัปโหลดเอกสารเข้า Wallet
         OB_FILL : ฟิลด์ใน S.p ที่ผู้ใช้ต้องกรอกเอง (ล้างค่าตอนล็อกอิน — ค่าใน PERSONAS ใช้เป็น "ข้อมูลตัวอย่าง")
         OB_DOCS : เอกสารประจำตัวที่ให้อัปโหลดตอนเริ่มใช้งาน (หนังสือรับรองมหาวิทยาลัยต้องขอใหม่ทุกครั้ง จึงไม่อยู่ในนี้) */
      const OB_STEPS = ["ข้อมูลจาก ตม.", "ข้อมูลการศึกษา", "ที่อยู่และการติดต่อ", "อัปโหลดเอกสาร"];
      const OB_FILL = ["group", "uni", "faculty", "studentId", "studyEnd", "address", "phone", "email"];
      const OB_DOCS = ["passport", "photo", "student_id", "tm30_receipt", "prev90"];
      const OB_REQ_DOCS = ["passport"];
      const OB_HINT = {
        passport: "หน้าข้อมูลส่วนตัว และหน้าวีซ่า/ตราประทับล่าสุด",
        student_id: "ด้านหน้าบัตร เห็นชื่อและรหัสนักศึกษาชัดเจน",
      };
      /** อัปเดตค่าที่ผู้ใช้กรอก และลบ error ของช่องนั้น (ไม่ render ทั้งหน้า) */
      function obSet(k, v) {
        S.p[k] = v;
        if (S.ob.err[k]) {
          delete S.ob.err[k];
          const w = document.getElementById("w_" + k);
          if (w) {
            w.classList.remove("err");
            w.querySelector(".errmsg")?.remove();
          }
        }
      }
      /** (ปุ่มเดโม) เติมข้อมูลตัวอย่างของขั้นปัจจุบันจาก PERSONAS */
      function obSample() {
        const src = PERSONAS[S.ob.src];
        const keys = S.ob.step === 1 ? ["group", "uni", "faculty", "studentId", "studyEnd"] : ["address", "phone", "email"];
        keys.forEach((k) => (S.p[k] = src[k]));
        S.ob.err = {};
        render();
      }
      /** ตรวจข้อมูลของขั้นปัจจุบัน → คืน object error */
      function obCheck() {
        const p = S.p,
          e = {};
        const req = (k, m = "กรุณากรอกข้อมูลนี้") => {
          if (!String(p[k] ?? "").trim()) e[k] = m;
        };
        if (S.ob.step === 1) {
          req("group", "กรุณาเลือกระดับการศึกษา");
          req("uni");
          req("faculty");
          req("studentId");
          req("studyEnd");
          if (p.studentId && !/^\d{6,12}$/.test(p.studentId.trim())) e.studentId = "รหัสนักศึกษาต้องเป็นตัวเลข 6–12 หลัก";
          if (p.studyEnd && p.studyEnd <= iso8(TODAY)) e.studyEnd = "วันสิ้นสุดหลักสูตรต้องเป็นวันในอนาคต";
        }
        if (S.ob.step === 2) {
          req("address");
          req("phone");
          if (p.phone && !/^0\d{8,9}$/.test(p.phone.replace(/[\s-]/g, ""))) e.phone = "รูปแบบเบอร์โทรไม่ถูกต้อง เช่น 081-234-5678";
          if (p.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email.trim())) e.email = "รูปแบบอีเมลไม่ถูกต้อง";
        }
        if (S.ob.step === 3) {
          OB_REQ_DOCS.forEach((k) => {
            if (!p.wallet.includes(k)) e[k] = "จำเป็นต้องอัปโหลดก่อนเริ่มใช้งาน";
          });
        }
        return e;
      }
      /** ไปขั้นถัดไป (หรือเสร็จสิ้นเมื่อถึงขั้นสุดท้าย) */
      function obNext() {
        S.ob.err = obCheck();
        const k = Object.keys(S.ob.err);
        if (k.length) {
          render();
          toast(S.ob.step === 3 ? "กรุณาอัปโหลดหนังสือเดินทาง" : `กรุณาตรวจสอบข้อมูล ${k.length} รายการ`);
          const el = document.getElementById("w_" + k[0]);
          el && el.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        if (S.ob.step < 3) {
          S.ob.step++;
          render(true);
          return;
        }
        S.confirmed = true;
        S.hist = [];
        S.screen = "home";
        render(true);
        toast("ตั้งค่าบัญชีเรียบร้อย");
      }
      /** ย้อนกลับหนึ่งขั้น (ขั้นแรก = กลับหน้าเข้าสู่ระบบ) */
      function obBack() {
        S.ob.err = {};
        if (S.ob.step > 0) {
          S.ob.step--;
          render(true);
        } else logout();
      }
      /** อัปโหลดเอกสาร (จำลอง): แสดงสถานะกำลังอัปโหลด 0.8 วินาที แล้วเก็บเข้า Wallet */
      function obUpload(k, how) {
        S.ob.up[k] = "loading";
        delete S.ob.err[k];
        render();
        setTimeout(() => {
          if (!S.p || !S.ob) return; // ออกจากระบบไปแล้ว
          S.ob.up[k] = how;
          S.p.uploads[k] = true;
          if (!S.p.wallet.includes(k)) S.p.wallet.push(k);
          if (S.screen === "onboard") render();
          toast(`อัปโหลด "${DOCS[k].n}" แล้ว`);
        }, 800);
      }
      /** ลบเอกสารที่อัปโหลด (เพื่ออัปโหลดใหม่) */
      function obRemove(k) {
        delete S.ob.up[k];
        delete S.p.uploads[k];
        S.p.wallet = S.p.wallet.filter((x) => x !== k);
        render();
      }
      /** ออกจากระบบ / เปลี่ยนผู้ใช้ตัวอย่าง */
      function logout() {
        S.p = null;
        S.hist = [];
        S.screen = "login";
        S.loginPass = null;
        render(true);
      }
      /** ปุ่มล่างหน้า Profile: ครั้งแรก = ยืนยันข้อมูลแล้วไป Home, ครั้งต่อไป = บันทึกการแก้ไข */
      function confirmProfile() {
        const a = document.getElementById("p_addr"),
          ph = document.getElementById("p_phone");
        if (a && !a.value.trim()) {
          toast("กรุณากรอกที่อยู่");
          return;
        }
        if (ph && !ph.value.trim()) {
          toast("กรุณากรอกเบอร์โทรศัพท์");
          return;
        }
        if (!S.confirmed) {
          S.confirmed = true;
          S.hist = [];
          S.screen = "home";
          render(true);
          toast("ยืนยันข้อมูลเรียบร้อย");
        } else {
          toast("บันทึกข้อมูลแล้ว");
          render();
        }
      }
      /**
       * เปิดบริการ: เตรียมฟอร์ม (ค่าเริ่มต้นจาก fields) และสถานะเอกสารแต่ละรายการ
       * ถ้ากลับมาบริการเดิม จะคงข้อมูลที่กรอกไว้
       */
      function openSvc(id) {
        if (S.svc !== id || !S.form._init) {
          S.svc = id;
          S.form = { _init: 1 };
          SV[id].fields(S.p).forEach((f) => (S.form[f.id] = f.v));
          S.errors = {};
          S.agree = false;
          S.docs = {};
          SV[id].docs.forEach((k) => {
            const d = DOCS[k];
            S.docs[k] = d.auto
              ? "auto"
              : S.p.wallet.includes(k)
                ? "wallet"
                : S.p.uploads[k]
                  ? "upload"
                  : d.opt
                    ? "opt"
                    : "miss";
          });
        }
        go("form");
      }
      /** บันทึกค่าที่ผู้ใช้กรอก และลบข้อความ error ของช่องนั้นทันที (ไม่ต้อง render ใหม่ทั้งหน้า) */
      function setF(id, v) {
        S.form[id] = v;
        if (S.errors[id]) {
          delete S.errors[id];
          const w = document.getElementById("w_" + id);
          if (w) {
            w.classList.remove("err");
            w.querySelector(".errmsg")?.remove();
          }
        }
        if (S.svc === "tm30") updMsg();
      }
      /** ตรวจความถูกต้องของฟอร์ม (ช่องบังคับ + กฎเฉพาะบริการ) ถ้าผ่านไปหน้า Check */
      function toChecklist() {
        const fs = SV[S.svc].fields(S.p);
        S.errors = {};
        fs.forEach((f) => {
          if (f.req && !String(S.form[f.id] ?? "").trim()) S.errors[f.id] = "กรุณากรอกข้อมูลนี้";
        });
        if (S.svc === "reentry" && S.form.depart && S.form.ret && S.form.ret <= S.form.depart)
          S.errors.ret = "วันเดินทางกลับต้องอยู่หลังวันเดินทางออก";
        if (S.svc === "reentry" && S.form.depart && S.form.depart < iso8(TODAY))
          S.errors.depart = "วันเดินทางออกต้องไม่ใช่วันที่ผ่านมาแล้ว";
        if (S.svc === "report90" && S.form.stay === "ย้ายที่พักแล้ว") {
          S.errors.stay = "กรุณาแจ้งที่พัก (ตม.30) ให้เรียบร้อยก่อนรายงานตัว";
        }
        const k = Object.keys(S.errors);
        if (k.length) {
          render();
          toast(`กรุณาตรวจสอบข้อมูล ${k.length} รายการ`);
          const el = document.getElementById("w_" + k[0]);
          el && el.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        go("check");
      }
      /**
       * จัดการเอกสารที่ยังขาด: 'upload' อัปโหลดทันที
       * 'univ' / 'owner' → สถานะ wait แล้วจำลองว่าได้รับเอกสารใน 2.2 วินาที
       */
      function docAct(k, a) {
        if (a === "upload") {
          S.docs[k] = "upload";
          S.p.uploads[k] = true;
          if (!S.p.wallet.includes(k)) S.p.wallet.push(k);
          toast("อัปโหลดเอกสารแล้ว (จำลอง) · บันทึกใน Wallet");
          render();
        }
        if (a === "univ") {
          S.docs[k] = "wait";
          render();
          toast("ส่งคำขอถึงงานทะเบียนมหาวิทยาลัยแล้ว");
          setTimeout(() => {
            S.docs[k] = "univ";
            S.p.uploads[k] = true;
            if (!S.p.wallet.includes(k)) S.p.wallet.push(k);
            if (S.screen === "check" || S.screen === "form") render();
            toast("มหาวิทยาลัยส่งหนังสือรับรองให้แล้ว");
          }, 2200);
        }
        if (a === "owner") {
          S.docs[k] = "wait";
          render();
          toast("ส่งคำขอเอกสารถึงเจ้าของที่พักแล้ว");
          setTimeout(() => {
            S.docs[k] = "owner";
            if (S.screen === "check" || S.screen === "form") render();
            toast("เจ้าของที่พักส่งเอกสารแล้ว");
          }, 2200);
        }
      }
      /** สถานะเอกสารที่ถือว่า "พร้อมแล้ว" */
      const docReady = (v) => ["auto", "wallet", "upload", "univ", "owner", "opt"].includes(v);
      /** ส่งคำขอ: สร้างหมายเลขอ้างอิง (TR-XXX-69xxxx) เพิ่มลง S.requests แล้วแสดง modal */
      function submit() {
        const sv = SV[S.svc];
        const id =
          "TR-" +
          S.svc.slice(0, 3).toUpperCase() +
          "-69" +
          String(Math.floor(Math.random() * 90000) + 10000);
        S.requests.unshift({
          id,
          svc: S.svc,
          step: 1,
          steps: sv.track,
          date: iso8(TODAY),
          done: false,
          form: { ...S.form },
        });
        S.form = {};
        S.modal = { id, svc: S.svc };
        showModal();
      }
      /** (ปุ่มเดโม) เลื่อนสถานะคำขอไปขั้นถัดไป — ครบทุกขั้นแล้วเรียก applyDone() */
      function advance(rid) {
        const r = S.requests.find((x) => x.id === rid);
        if (!r || r.done) return;
        r.step++;
        if (r.step >= r.steps.length) {
          r.done = true;
          applyDone(r);
        } else toast(`อัปเดตสถานะ: ${r.steps[r.step - 1]}`);
        render();
      }
      /** เมื่อคำขอเสร็จ อัปเดตข้อมูลผู้ใช้ตามผลลัพธ์ เช่น ขยายวันหมดอายุวีซ่า +365 วัน, เลื่อนกำหนด 90 วัน */
      function applyDone(r) {
        const p = S.p;
        let m = "";
        if (r.svc === "ext") {
          p.stayStart = p.expiry;
          p.expiry = addDays(p.expiry, 365);
          m = `วีซ่าขยายถึง ${fd(p.expiry)} แล้ว`;
        }
        if (r.svc === "report90") {
          p.report90 = addDays(p.report90, 90);
          m = `รายงานตัวครั้งถัดไป ${fd(p.report90)}`;
        }
        if (r.svc === "reentry") {
          p.reentryOK = true;
          m = "ได้รับ Re-entry Permit แล้ว";
        }
        if (r.svc === "tdac") {
          p.tdacOK = true;
          m = "ได้รับ QR TDAC แล้ว";
        }
        if (r.svc === "tm30") {
          p.address = r.form.newAddress;
          m = "อัปเดตที่อยู่ใหม่ในโปรไฟล์แล้ว";
        }
        r.result = m;
        toast("เสร็จสิ้น · " + m + " อัปเดตในแอปทันที");
      }
      /** ยืนยันนัดหมาย ตม. (ต้องเลือกวันและเวลาก่อน) */
      function book() {
        if (!S.apDate || !S.apTime) {
          toast("กรุณาเลือกวันและเวลา");
          return;
        }
        S.appt = { d: S.apDate, t: S.apTime };
        render();
        toast("ยืนยันนัดหมายเรียบร้อยแล้ว");
      }
      /** คัดลอกข้อความสองภาษาถึงเจ้าของที่พัก (บริการ ตม.30) */
      function copyMsg() {
        const m = tm30Msg();
        const txt = m.th + "\n\n" + m.en;
        try {
          navigator.clipboard && navigator.clipboard.writeText(txt);
        } catch (e) {}
        toast("คัดลอกข้อความสองภาษาแล้ว");
      }

      /* ==================================================================
       * 9. SCREENS — แต่ละหน้าคือฟังก์ชันที่คืนค่าเป็นสตริง HTML
       *
       * render() จะเรียก SCREENS[S.screen]() แล้วใส่ผลลัพธ์ลงใน #screen
       *
       *   login → profile → home → select → form → check → (modal) → track
       * ================================================================== */
      const SCREENS = {};

      /* ---------- UI ช่วยแสดงผล (ดีไซน์เท่านั้น ไม่ใช่ข้อมูลหรือกฎ) ----------
         UI : สถานะการแสดงผลชั่วคราว เช่น แท็บที่เลือก กลุ่มที่ยุบ/กาง — แยกจาก S เพื่อไม่ยุ่งกับ state หลัก */
      const UI = {
        trackTab: "active", // แท็บในหน้าสถานะ: active | done
        remOpen: false, // กางตั้งค่าแจ้งเตือน
        docsOpen: false, // กางรายการเอกสารในหน้าฟอร์ม
        readyOpen: true, // กางกลุ่ม "พร้อมแล้ว" ในหน้าตรวจเอกสาร
        profOpen: null, // หมวดที่กางในหน้าของฉัน ('_none' = ปิดทั้งหมด)
      };
      function uiSet(k, v) {
        UI[k] = v;
        render();
      }
      /** เลื่อนไปยัง element ตาม id (ใช้กับปุ่มลัดในหน้า) */
      function jump(id) {
        const el = document.getElementById(id);
        el && el.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      /** stepper แนวนอน: labels = ชื่อขั้นจากข้อมูลเดิม, cur = index ขั้นปัจจุบัน, all = เสร็จทุกขั้น */
      function stepper(labels, cur, all) {
        return `<ol class="stp">${labels
          .map((t, i) => {
            const c = all || i < cur ? "done" : i === cur ? "now" : "";
            return `<li class="${c}"><span class="stp-d">${c === "done" ? ic("check", 14) : i + 1}</span><span class="stp-t">${t}</span></li>`;
          })
          .join("")}</ol>`;
      }
      /** วงแหวนความครบถ้วน ok/total */
      function ring(ok, total, size = 48) {
        const r = 15.5,
          c = 2 * Math.PI * r,
          f = total ? ok / total : 0;
        const col = f >= 1 ? "var(--green)" : "var(--orange)";
        return `<span class="ring-w" style="width:${size}px;height:${size}px"><svg viewBox="0 0 36 36" width="${size}" height="${size}"><circle cx="18" cy="18" r="${r}" fill="none" stroke="var(--blue-50)" stroke-width="3.5"/><circle cx="18" cy="18" r="${r}" fill="none" stroke="${col}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${c * f} ${c}" transform="rotate(-90 18 18)"/></svg><b style="font-size:${Math.round(size / 3.6)}px">${ok}/${total}</b></span>`;
      }
      /** ปิดบางหลักของเลขหนังสือเดินทาง */
      const mask = (s) => String(s).slice(0, 2) + "•••••" + String(s).slice(-2);
      /** ลาย QR ตกแต่ง (สร้างจากตัวอักษรเลขพาสปอร์ต) — ไม่ใช่ QR ที่สแกนได้จริง */
      function qrDeco(seed) {
        let h = 7,
          cells = "";
        for (let y = 0; y < 9; y++)
          for (let x = 0; x < 9; x++) {
            const corner = (x < 3 && y < 3) || (x > 5 && y < 3) || (x < 3 && y > 5);
            h = (h * 31 + seed.charCodeAt((x + y * 9) % seed.length)) % 997;
            const hole = (x === 1 || x === 7) && (y === 1 || y === 7);
            if (corner ? !hole : h % 3 === 0)
              cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
          }
        return `<svg viewBox="-0.5 -0.5 10 10" width="100%" height="100%" fill="var(--navy)">${cells}</svg>`;
      }
      /** การ์ดกำหนดการแบบเลื่อนแนวนอน (หน้าสถานะ) — สีขอบบนตามความเร่งด่วน */
      function tlCard(x) {
        const d = D(x.d),
          n = days(x.d);
        const u = x.done ? "ok" : n <= 7 ? "red" : n <= 30 ? "amber" : "gray";
        const b = x.done ? "b-green" : n <= 7 ? "b-red" : n <= 30 ? "b-amber" : "b-gray";
        return `<div class="tlc ${u}"><div class="tlc-d"><b>${d.getDate()}</b> ${TH_M[d.getMonth()]}</div><b class="tlc-t">${x.t}</b><small>${x.s || ""}</small><span class="badge ${b}">${x.done ? "เสร็จแล้ว" : inDays(n)}</span></div>`;
      }
      /** ค้นหาบริการในหน้า "บริการทั้งหมด" (กรองที่หน้าจอ ไม่เปลี่ยนข้อมูล) */
      function filterSvc(q) {
        q = q.trim().toLowerCase().replace(/\s+/g, "");
        let n = 0;
        document.querySelectorAll("[data-q]").forEach((el) => {
          const hit = !q || el.dataset.q.toLowerCase().replace(/\s+/g, "").includes(q);
          el.style.display = hit ? "" : "none";
          if (hit && el.classList.contains("tile")) n++;
        });
        document.querySelectorAll(".rec-sec").forEach((s) => {
          s.style.display = [...s.querySelectorAll("[data-q]")].some((e) => e.style.display !== "none") ? "" : "none";
        });
        const nr = document.getElementById("noRes");
        if (nr) nr.style.display = n ? "none" : "";
      }

      /* ---------- หน้า LOGIN : เลือกผู้ใช้ตัวอย่าง + กรอกหนังสือเดินทาง/OTP (จำลอง) ---------- */
      SCREENS.login = () => {
        const sel = S.loginPick;
        return `<div class="content">
 <div class="login-hero"><img class="login-logo" src="${LOGO}" alt="ทางรัฐ"><h1>บริการนักศึกษาต่างชาติ</h1><p>วีซ่าและการพำนักในไทย</p><span class="proto-tag">ต้นแบบ · ข้อมูลจำลอง</span></div>
 <div class="lang">${["ไทย", "English", "中文"].map((l, i) => `<button class="chip ${i ? "" : "on"}" onclick="toast('ต้นแบบนี้แสดงผลภาษาไทย')">${l}</button>`).join("")}</div>
 <div class="sec-title">เลือกผู้ใช้ตัวอย่าง</div>
 ${["edplus", "ed"]
   .map((k) => {
     const p = PERSONAS[k];
     return `<button class="persona ${sel === k ? "on" : ""}" onclick="S.loginPick='${k}';S.loginPass=null;render()"><span class="avatar">${p.initials}</span><span class="pi"><b>${p.name}</b><span class="badge b-blue">${p.visa.replace("Non-Immigrant ", "")}</span><small>${p.desc}</small></span><span class="radio"></span></button>`;
   })
   .join("")}
 <div class="card mt12">
  <div class="field"><label>เลขหนังสือเดินทาง</label><input value="${esc(S.loginPass ?? PERSONAS[sel].passport)}" oninput="S.loginPass=this.value" autocomplete="off"></div>
  <div class="field" style="margin-bottom:0"><label>รหัส OTP</label><input inputmode="numeric" maxlength="6" value="${esc(S.loginOtp ?? "123456")}" oninput="S.loginOtp=this.value"><div class="hint">รหัสสำหรับทดลอง: 123456</div></div>
  <div class="login-note">${ic("shield", 16)}<span>ระบบจะดึงข้อมูลพื้นฐานจาก ตม. ให้อัตโนมัติ ส่วนข้อมูลการศึกษา ที่อยู่ และเอกสาร คุณกรอกและอัปโหลดเองในขั้นถัดไป</span></div>
 </div></div>
 <div class="footer-cta"><button class="btn btn-primary" onclick="doLogin()">เข้าสู่ระบบ</button></div>`;
      };

      /* ---------- หน้า ONBOARD : ตั้งค่าบัญชีครั้งแรก 4 ขั้น (ข้อมูลจาก ตม. → การศึกษา → ที่อยู่ → เอกสาร) ---------- */
      SCREENS.onboard = () => {
        const p = S.p,
          ob = S.ob,
          st = ob.step,
          e = ob.err;
        // ช่องกรอกของ onboarding (ค่าอยู่ใน S.p โดยตรง)
        const inp = (k, l, o = {}) => {
          const v = p[k] ?? "",
            er = e[k];
          let c;
          if (o.type === "select")
            c = `<select onchange="obSet('${k}',this.value)"><option value="" ${v ? "" : "selected"} disabled>เลือก…</option>${o.opts.map((x) => `<option ${x === v ? "selected" : ""}>${x}</option>`).join("")}</select>`;
          else if (o.type === "textarea")
            c = `<textarea rows="3" placeholder="${o.ph || ""}" oninput="obSet('${k}',this.value)">${esc(v)}</textarea>`;
          else
            c = `<input type="${o.type || "text"}" ${o.im ? `inputmode="${o.im}"` : ""} value="${esc(v)}" placeholder="${o.ph || ""}" oninput="obSet('${k}',this.value)">`;
          return `<div class="field ${er ? "err" : ""}" id="w_${k}"><label>${l}${o.opt ? ' <span class="optl">ไม่บังคับ</span>' : " <i>*</i>"}</label>${c}${er ? `<div class="errmsg">${ic("alert", 14)} ${er}</div>` : ""}${o.ex ? `<div class="ex"><b>ตัวอย่าง</b>${o.ex}</div>` : ""}${o.hint ? `<div class="hint">${o.hint}</div>` : ""}</div>`;
        };
        const sampleBtn = `<button class="demo-fill" onclick="obSample()">${ic("spark", 16)} เติมข้อมูลตัวอย่าง (สำหรับเดโม)</button>`;
        let body, cta;
        if (st === 0) {
          // ขั้น 1: ข้อมูลพื้นฐานที่ดึงจาก ตม. (แก้ไม่ได้)
          const rows = [
            ["ชื่อ-นามสกุล", p.name],
            ["สัญชาติ", p.nat],
            ["เลขหนังสือเดินทาง", p.passport],
            ["ประเภทวีซ่า", p.visa],
            ["อนุญาตให้อยู่ถึง", fd(p.expiry)],
            ["รายงานตัว 90 วันครั้งถัดไป", fd(p.report90)],
          ];
          body = `<div class="card float">
  <div class="flex" style="gap:12px"><span class="avatar">${p.initials}</span><div class="sp"><b style="font-size:16.5px;display:block">${p.name}</b><span class="badge b-leaf">${ic("shield", 12)} ดึงจาก ตม. อัตโนมัติ</span></div></div>
  <div class="mt12">${rows.map(([a, b]) => `<div class="kv"><span>${a}</span><b>${b}</b></div>`).join("")}</div>
  <div class="lock-note">${ic("shield", 15)}<span>ข้อมูลส่วนนี้มาจากระบบตรวจคนเข้าเมือง แก้ไขในแอปไม่ได้ หากไม่ถูกต้อง <a onclick="openHelp('staff')">ติดต่อเจ้าหน้าที่</a></span></div></div>
 <div class="sec-title">สิ่งที่คุณต้องทำต่อ</div>
 <div class="card todo">${[
   ["school", "กรอกข้อมูลการศึกษา", "มหาวิทยาลัย คณะ รหัสนักศึกษา วันจบหลักสูตร"],
   ["house", "กรอกที่อยู่และการติดต่อ", "ที่พักปัจจุบันในไทย เบอร์โทร อีเมล"],
   ["upload", "อัปโหลดเอกสารเข้ากระเป๋าเอกสาร", "หนังสือเดินทาง · รูปถ่าย · บัตรนักศึกษา · ใบรับ ตม.30"],
 ]
   .map(([i, t, s], n) => `<div class="row"><span class="ri c-blue">${ic(i, 20)}</span><div class="rt"><b>${n + 2}. ${t}</b><small>${s}</small></div></div>`)
   .join("")}</div>`;

 <details class="card acc2 mt16"><summary>บริการต่างกันอย่างไร?${ic("chev", 18)}</summary>
  <div class="cmp mt8">
  <div class="c-blue"><b>รายงานตัว 90 วัน</b>แจ้งว่ายังพำนักที่อยู่เดิม ไม่ใช่การขยายวีซ่า</div>
  <div class="c-blue"><b>ต่ออายุวีซ่า</b>ขยายระยะเวลาพำนักในประเทศไทย</div>
  <div class="c-blue"><b>Re-entry Permit</b>คงสถานะวีซ่าเมื่อเดินทางกลับเข้าประเทศ</div></div>
  <button class="btn btn-ghost btn-sm mt12" style="width:100%" onclick="openHelp('ai')">${ic("spark", 18)} ถามผู้ช่วย AI</button></details>
 </div>${nav("select")}`;
      };

      /* ---------- หน้า FORM : รายละเอียดบริการ (สิทธิ์, ขั้นตอน, เอกสาร) + แบบฟอร์ม ---------- */
      /** สร้างช่องกรอก 1 ช่องตาม f.type (select / textarea / chips / input) พร้อม error, hint, ตัวอย่าง */
      function field(f) {
        const v = S.form[f.id] ?? "",
          e = S.errors[f.id];
        // ช่องที่ระบบเติมจากข้อมูลผู้ใช้ (และผู้ใช้ยังไม่ได้แก้) → พื้นเทาอ่อน + ป้าย "ดึงอัตโนมัติ"
        const p = S.p,
          src = [p.address, p.phone, p.email, p.studyEnd, ...(p.trip ? Object.values(p.trip) : [])];
        const auto = f.v && v === f.v && src.includes(f.v) && f.type !== "chips";
        let inp;
        if (f.type === "select")
          inp = `<select onchange="setF('${f.id}',this.value)">${f.opts.map((o) => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
        else if (f.type === "textarea")
          inp = `<textarea rows="3" placeholder="${f.ph || ""}" oninput="setF('${f.id}',this.value)">${esc(v)}</textarea>`;
        else if (f.type === "chips")
          inp = `<div class="seg">${f.opts.map((o) => `<button class="${o.v === v ? "on" : ""}" onclick="setF('${f.id}','${o.v}');render()"><b>${o.l}</b><small>${o.s}</small></button>`).join("")}</div>`;
        else
          inp = `<input type="${f.type || "text"}" value="${esc(v)}" placeholder="${f.ph || ""}" oninput="setF('${f.id}',this.value)">`;
        return `<div class="field ${e ? "err" : ""} ${auto ? "auto" : ""}" id="w_${f.id}"><label>${f.l}${f.req ? " <i>*</i>" : ""}${auto ? `<span class="autotag">${ic("check", 12)} ดึงอัตโนมัติ</span>` : ""}</label>${inp}${e ? `<div class="errmsg">${ic("alert", 14)} ${e}</div>` : ""}${f.ex ? `<div class="ex"><b>ตัวอย่าง</b>${f.ex}</div>` : ""}${f.hint ? `<div class="hint">${f.hint}</div>` : ""}</div>`;
      }
      /** ข้อความสองภาษา (ไทย/อังกฤษ) ขอให้เจ้าของที่พักแจ้ง ตม.30 — เติมข้อมูลจากฟอร์มอัตโนมัติ */
      function tm30Msg() {
        const f = S.form,
          p = S.p;
        const a = f.newAddress || "(ที่อยู่ใหม่)",
          o = f.ownerName || "(ชื่อเจ้าของที่พัก)",
          d = f.moveIn || iso8(TODAY);
        return {
          th: `เรียน คุณ${o}\nดิฉัน/ผม ${p.name} สัญชาติ${p.nat} หนังสือเดินทางเลขที่ ${p.passport} ได้ย้ายเข้าพักที่ ${a} ตั้งแต่วันที่ ${fd(d)} รบกวนช่วยแจ้งที่พักคนต่างด้าว (ตม.30) ภายใน 24 ชั่วโมง ขอบคุณค่ะ/ครับ`,
          en: `Dear ${f.ownerName || "(owner name)"},\nI, ${p.name} (${p.natEn}, passport no. ${p.passport}), moved in to ${f.newAddress || "(new address)"} on ${fde(d)}. Could you kindly submit the TM.30 notification within 24 hours? Thank you.`,
        };
      }
      /** อัปเดตกล่องข้อความ ตม.30 ขณะพิมพ์ โดยไม่ render ทั้งหน้า */
      function updMsg() {
        const m = tm30Msg();
        const a = document.getElementById("m_th"),
          b = document.getElementById("m_en");
        if (a) a.textContent = m.th;
        if (b) b.textContent = m.en;
      }
      /** เนื้อหามี 3 แบบ: (1) มีคำขอค้างอยู่  (2) ยังไม่มีสิทธิ์ยื่น  (3) ปกติ → แสดงรายละเอียด + ฟอร์ม */
      SCREENS.form = () => {
        // เปลี่ยนบริการแล้ว ให้แถบเอกสารกลับไปเป็นแบบยุบ
        if (UI.lastSvc !== S.svc) {
          UI.docsOpen = false;
          UI.lastSvc = S.svc;
        }
        const s = SV[S.svc],
          p = S.p,
          e = elig(S.svc),
          fs = s.fields(p),
          r = reqOf(S.svc);
        const fee =
          S.svc === "reentry" ? (S.form.type === "multiple" ? "3,800 บาท" : "1,000 บาท") : s.fee;
        // นับจากสถานะเดียวกับหน้า Check (S.docs) เพื่อให้สองหน้าแสดงผลตรงกัน
        const ready = s.docs.filter((k) => docReady(S.docs[k])).length;
        const missK = s.docs.filter((k) => !docReady(S.docs[k]));
        const lbl = {
          auto: "ระบบสร้างให้อัตโนมัติ",
          wallet: "มีในระบบแล้ว",
          upload: "อัปโหลดแล้ว",
          univ: "ได้รับแล้ว",
          owner: "ได้รับแล้ว",
          opt: "ไม่บังคับ",
          wait: "รอรับเอกสาร",
          miss: "ยังไม่มีเอกสาร",
        };
        const canGo = !r && e.ok;
        let body;
        if (r)
          body = `<div class="alert blue float"><div class="ai">${ic("clock")}</div><div><b>มีคำขอนี้อยู่ระหว่างดำเนินการ</b><p>${r.id} · ${r.steps[r.step - 1]}</p><button class="btn btn-primary btn-sm" onclick="tab('track')">ติดตามสถานะ</button></div></div>`;
        else if (!e.ok)
          body = `<div class="alert ${e.soon ? "amber" : "red"} float"><div class="ai">${ic("alert")}</div><div><b>${e.t}</b><p style="white-space:pre-line">${e.m}</p><div class="flex" style="flex-wrap:wrap;gap:8px;margin-top:10px">${e.soon ? `<button class="btn btn-primary btn-sm" onclick="toast('ตั้งค่าการแจ้งเตือนแล้ว')">${ic("bell", 16)} แจ้งเตือนเมื่อถึงกำหนด</button>` : ""}<button class="btn btn-line btn-sm" onclick="openHelp('staff')">ติดต่อเจ้าหน้าที่</button></div></div></div>
  <div class="card mt12 flex" style="align-items:flex-start"><span style="color:var(--navy)">${ic("clock", 20)}</span><span style="font-size:13.5px">${s.when}</span></div>`;
        else
          body = `<div class="card float elig"><div class="el-top"><span class="el-ic">${ic("shield", 22)}</span><div class="sp"><b>${e.t || "ยื่นออนไลน์ได้"}</b>${e.m ? `<small>${e.m}</small>` : ""}</div></div><div class="el-when">${ic("clock", 16)}<span>${s.when}</span></div></div>
  <div class="card docbar ${UI.docsOpen ? "on" : ""}"><button class="db-h" onclick="uiSet('docsOpen',${!UI.docsOpen})">${ring(ready, s.docs.length, 46)}<span class="sp"><b>เอกสารที่ต้องใช้</b><small class="${missK.length ? "warn" : "ok"}">${missK.length ? "ขาด: " + missK.map((k) => DOCS[k].n).join(", ") : "พร้อมครบทุกรายการ"}</small></span><span class="pm-chev">${ic("chev", 18)}</span></button>
  ${
    UI.docsOpen
      ? `<div class="db-list">${s.docs
          .map((k) => {
            const d = DOCS[k],
              st = S.docs[k],
              ok = docReady(st) && st !== "opt";
            return `<div class="row"><span style="color:${ok ? "var(--green)" : st === "opt" ? "var(--ink-3)" : "var(--amber)"}">${ic(ok ? "check" : "doc", 20)}</span><div class="rt"><b style="font-weight:500;font-size:14px">${d.n}</b><small>${lbl[st]}</small></div></div>`;
          })
          .join("")}</div>`
      : ""
  }</div>
  <div class="sec-title">กรอกข้อมูล</div>
  <div class="card">${fs.map(field).join("")}
   <div class="kv" style="border-top:1px solid var(--line);margin-top:4px;padding-top:12px"><span>ค่าธรรมเนียม</span><b>${fee}</b></div></div>
  ${S.svc === "tm30" ? `<div class="sec-title">ข้อความแจ้งเจ้าของที่พัก</div><div class="card"><div class="msgbox"><span class="lbl">ภาษาไทย</span><span id="m_th">${esc(tm30Msg().th)}</span></div><div class="msgbox"><span class="lbl">English</span><span id="m_en">${esc(tm30Msg().en)}</span></div><button class="btn btn-ghost btn-sm mt12" style="width:100%" onclick="copyMsg()">${ic("copy", 18)} คัดลอกข้อความ</button></div>` : ""}`;
        return `${appbar(s.short)}
 <div class="content">
 <div class="svc-head"><span class="ri ${s.c}">${ic(s.ic, 26)}</span><div><h2>${s.name}</h2><p>${s.sub}</p></div></div>
 <div class="stepbox">${stepper(s.steps, canGo ? 1 : 0)}</div>
 ${body}
 </div>
 ${canGo ? `<div class="footer-cta"><button class="btn btn-primary" onclick="toChecklist()">ถัดไป: ตรวจสอบเอกสาร ${ic("chev", 18)}</button></div>` : ""}`;
      };

      /* ---------- หน้า CHECK : ตรวจเอกสารครบไหม + ความสอดคล้องข้อมูล + สรุป + ยอมรับเงื่อนไข ----------
         ปุ่มส่งคำขอจะกดได้เมื่อเอกสารครบ และยืนยันความถูกต้องแล้ว (S.agree) */
      SCREENS.check = () => {
        const s = SV[S.svc],
          p = S.p,
          ks = s.docs,
          ok = ks.filter((k) => docReady(S.docs[k])).length,
          miss = ks.length - ok,
          allOK = miss === 0;
        const fs = s.fields(p);
        const needs = ks.filter((k) => !docReady(S.docs[k])),
          readyK = ks.filter((k) => docReady(S.docs[k]));
        const fmt = (f, v) =>
          f.type === "date"
            ? fd(v)
            : f.type === "chips"
              ? f.opts.find((o) => o.v === v)?.l
              : esc(v);
        const row = (k) => {
          const d = DOCS[k],
            st = S.docs[k];
          const map = {
            auto: ["ok", "check", "ระบบสร้างให้อัตโนมัติ"],
            wallet: ["ok", "check", "มีในระบบแล้ว"],
            upload: ["ok", "check", "อัปโหลดแล้ว"],
            univ: ["ok", "check", "ได้รับแล้ว"],
            owner: ["ok", "check", "ได้รับแล้ว"],
            opt: ["opt", "doc", d.why || "ไม่บังคับ"],
            wait: ["wait", "clock", "รอรับเอกสาร"],
            miss: ["miss", "alert", "ยังไม่มีเอกสาร"],
          };
          const [c, i, t] = map[st];
          const acts =
            st === "miss"
              ? `<div class="acts">${d.act === "univ" ? `<button class="btn btn-primary btn-sm" onclick="docAct('${k}','univ')">${ic("school", 16)} ขอจากมหาวิทยาลัย</button>` : ""}${d.act === "owner" ? `<button class="btn btn-primary btn-sm" onclick="docAct('${k}','owner')">${ic("send", 16)} ขอจากเจ้าของที่พัก</button>` : ""}<button class="btn ${d.act === "upload" ? "btn-primary" : "btn-ghost"} btn-sm" onclick="docAct('${k}','upload')">${ic("upload", 16)} อัปโหลดเอกสาร</button></div>`
              : "";
          return `<div class="doc"><span class="st ${c}">${ic(i, 16)}</span><div class="dt"><b>${d.n}</b><small class="${st === "miss" ? "r" : ""}">${t}</small>${st === "miss" && d.why ? `<small>${d.why}</small>` : ""}${acts}</div></div>`;
        };
        // ความสอดคล้องของข้อมูล (ย้ายมาสรุปในการ์ดบนสุด)
        const cons = [
          ["ชื่อตรงกับหนังสือเดินทาง", p.name],
          ["เลขหนังสือเดินทางตรงกับวีซ่า", p.passport],
          ["ที่อยู่ตรงกับ ตม.30", S.svc === "tm30" ? "ใช้ที่อยู่ใหม่" : "ตรงกัน"],
        ];
        return `${appbar("ตรวจสอบก่อนยื่น", { sub: s.short })}
 <div class="content">
 <div class="stepbox">${stepper(s.steps, 2)}</div>
 <div class="card float chk-sum">${ring(ok, ks.length, 76)}<div class="sp"><b>${allOK ? "เอกสารครบแล้ว พร้อมยื่น" : `อีก ${miss} รายการก็ยื่นได้`}</b><small class="cons-ok">${ic("check", 14)} ข้อมูลตรงกันทุกจุด</small><small>${cons.map(([a, b]) => `${a}${b === "ใช้ที่อยู่ใหม่" ? ` (${b})` : ""}`).join(" · ")}</small></div></div>
 ${needs.length ? `<div class="sec-title" id="needs">ต้องจัดการ <span class="badge b-amber">${needs.length}</span></div>${needs.map((k) => `<div class="card needc">${row(k)}</div>`).join("")}` : ""}
 <div class="sec-title">พร้อมแล้ว (${readyK.length}) <a onclick="uiSet('readyOpen',${!UI.readyOpen})">${UI.readyOpen ? "ซ่อน" : "แสดง"}</a></div>
 ${UI.readyOpen ? `<div class="card readyl" style="padding:0 16px">${readyK.map(row).join("")}</div>` : ""}
 <div class="sec-title">สรุปข้อมูล <a onclick="back()">${ic("edit", 14)} แก้ไข</a></div>
 <div class="card">${fs.map((f) => `<div class="kv"><span>${f.l}</span><b>${fmt(f, S.form[f.id]) || "-"}</b></div>`).join("")}</div>
 <div class="card mt12" id="agree"><div class="check ${S.agree ? "on" : ""}" onclick="S.agree=!S.agree;render()"><span class="box">${S.agree ? ic("check", 16) : ""}</span><span>ข้าพเจ้าขอยืนยันว่าข้อมูลและเอกสารถูกต้องตามความเป็นจริง</span></div></div>
 </div>
 <div class="footer-cta">${!allOK ? `<button class="note warn" onclick="jump('needs')">${ic("alert", 15)} ยังยื่นไม่ได้ · ไปแก้ ${miss} รายการ ›</button>` : !S.agree ? `<button class="note warn" onclick="jump('agree')">${ic("alert", 15)} กรุณาติ๊กยืนยันความถูกต้องของข้อมูล ›</button>` : ""}<button class="btn btn-primary" ${allOK && S.agree ? "" : "disabled"} onclick="submit()">${S.svc === "tm30" ? "ส่งข้อความถึงเจ้าของที่พัก" : "ยืนยันและยื่นคำขอ"}</button></div>`;
      };

      /* ---------- หน้า TRACK : คำขอของฉัน + ไทม์ไลน์การพำนัก + ตั้งค่าแจ้งเตือน + นัดหมาย ตม. ---------- */
      SCREENS.track = () => {
        const p = S.p,
          rs = S.requests;
        const wd = [];
        let d = D(iso8(TODAY));
        while (wd.length < 6) {
          d.setDate(d.getDate() + 1);
          if (d.getDay() % 6) wd.push(iso8(d));
        }
        const DOW = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."];
        const act = rs.filter((r) => !r.done),
          fin = rs.filter((r) => r.done),
          cur = act[0];
        const a = topAction();
        // การ์ดบนสุด: คำขอล่าสุดที่กำลังดำเนินการ / ถ้าไม่มี แนะนำสิ่งที่ควรทำ
        let hero;
        if (cur) {
          const s = SV[cur.svc];
          hero = `<div class="card float rq-hero"><div class="flex"><span class="badge b-amber">${cur.steps[cur.step - 1]}</span><span class="sp"></span><span class="muted" style="font-size:12px">${cur.id}</span></div>
  <div class="flex" style="margin-top:10px;gap:12px"><span class="ri ${s.c}">${ic(s.ic, 22)}</span><div class="sp"><b style="display:block;font-size:16px;line-height:1.3">${s.name}</b><span class="muted" style="font-size:12.5px">ยื่นเมื่อ ${fd(cur.date)}</span></div></div>
  ${stepper(cur.steps, cur.step - 1)}
  <div class="btn2"><button class="btn btn-ghost btn-sm" onclick="jump('rq_${cur.id}')">ดูรายละเอียด</button><button class="btn btn-primary btn-sm" onclick="jump('appt')">${ic("cal", 16)} จองนัด ตม.</button></div></div>`;
        } else {
          hero = `<div class="card float rq-empty"><div class="flex" style="gap:12px"><span class="ei c-blue">${ic("doc", 24)}</span><div class="sp"><b style="display:block;font-size:15.5px">${rs.length ? "ไม่มีคำขอที่กำลังดำเนินการ" : "ยังไม่มีคำขอ"}</b><span class="muted" style="font-size:12.5px">${a.b ? "สิ่งที่ควรทำตอนนี้" : a.m}</span></div></div>
  ${a.b ? `<button class="sugg ${a.c === "red" ? "hot" : ""}" onclick="openSvc('${a.svc}')"><span class="ai">${ic(a.i, 20)}</span><span class="sp"><b>${a.t}</b><small>${a.b}</small></span>${ic("chev", 18)}</button>` : `<button class="btn btn-primary btn-sm mt12" style="width:100%" onclick="tab('select')">เลือกบริการ</button>`}</div>`;
        }
        // ความเคลื่อนไหวล่าสุด (สร้างจากขั้นสถานะใน S.requests)
        const evs = [];
        rs.forEach((r) => {
          const n = r.done ? r.steps.length : r.step;
          for (let i = n - 1; i >= 0; i--)
            evs.push({ t: r.steps[i], s: SV[r.svc].short, id: r.id, now: !r.done && i === r.step - 1, first: i === 0, date: r.date });
        });
        const list = UI.trackTab === "done" ? fin : act;
        const rqCard = (r) => {
          const s = SV[r.svc];
          return `<div class="card rq" id="rq_${r.id}"><div class="flex"><span class="ri ${s.c}">${ic(s.ic, 20)}</span><div class="sp"><b style="font-size:14.5px;display:block;line-height:1.3">${s.name}</b><span class="muted">${r.id}</span></div>${r.done ? '<span class="badge b-green">เสร็จสิ้น</span>' : '<span class="badge b-blue">กำลังดำเนินการ</span>'}</div>
  <ul class="track">${r.steps.map((t, i) => `<li class="${i < r.step - 1 || r.done ? "done" : i === r.step - 1 ? "now" : ""}">${t}</li>`).join("")}</ul>
  ${r.done ? `<div class="alert green mt12"><div class="ai">${ic("check")}</div><div><b>${r.result}</b></div></div>` : `<button class="btn btn-ghost btn-sm mt12" style="width:100%" onclick="advance('${r.id}')">${ic("play", 16)} จำลองสถานะถัดไป</button>`}</div>`;
        };
        const remOn = [
          ["d30", 30],
          ["d7", 7],
          ["d1", 1],
        ].filter(([k]) => S.rem[k]);
        return `${appbar("สถานะคำขอ")}
 <div class="content">
 ${hero}
 ${
   rs.length
     ? `<div class="sec-title">คำขอของฉัน</div>
 <div class="seg2"><button class="${UI.trackTab !== "done" ? "on" : ""}" onclick="uiSet('trackTab','active')">กำลังดำเนินการ (${act.length})</button><button class="${UI.trackTab === "done" ? "on" : ""}" onclick="uiSet('trackTab','done')">เสร็จสิ้น (${fin.length})</button></div>
 ${list.length ? list.map(rqCard).join("") : `<div class="card muted" style="text-align:center">${UI.trackTab === "done" ? "ยังไม่มีคำขอที่เสร็จสิ้น" : "ไม่มีคำขอที่กำลังดำเนินการ"}</div>`}
 <div class="sec-title">ความเคลื่อนไหวล่าสุด ${evs.length > 3 ? `<a onclick="jump('rq_${rs[0].id}')">ดูทั้งหมด</a>` : ""}</div>
 <div class="card" style="padding:6px 16px"><ul class="feed">${evs
   .slice(0, 3)
   .map((x) => `<li class="${x.now ? "now" : "done"}"><b>${x.t}</b><small>${x.s} · ${x.id}${x.first ? ` · ${fd(x.date)}` : ""}</small></li>`)
   .join("")}</ul></div>`
     : ""
 }
 <div class="sec-title">กำหนดการสำคัญ</div>
 <div class="hscroll">${timeline().map(tlCard).join("")}</div>
 <div class="sec-title">การแจ้งเตือน</div>
 <div class="card" style="padding:4px 16px"><button class="row remrow" onclick="uiSet('remOpen',${!UI.remOpen})"><span class="ri c-blue">${ic("bell", 20)}</span><span class="rt"><b>${remOn.length ? `แจ้งเตือนล่วงหน้า ${remOn.map((x) => x[1]).join(" · ")} วัน` : "ปิดการแจ้งเตือนล่วงหน้า"}</b><small>${remOn.length ? "เปิดอยู่" : "แตะเพื่อตั้งค่า"}</small></span><span class="pm-chev ${UI.remOpen ? "open" : ""}">${ic("chev", 18)}</span></button>
 ${
   UI.remOpen
     ? [
         ["d30", "30 วันก่อนครบกำหนด"],
         ["d7", "7 วันก่อนครบกำหนด"],
         ["d1", "1 วันก่อนครบกำหนด"],
       ]
         .map(
           ([k, a]) =>
             `<div class="row"><div class="rt"><b style="font-weight:500">${a}</b></div><button class="toggle ${S.rem[k] ? "on" : ""}" onclick="S.rem['${k}']=!S.rem['${k}'];render()" aria-label="${a}"></button></div>`,
         )
         .join("")
     : ""
 }</div>
 <div class="sec-title" id="appt">นัดหมาย ตม.</div>
 <div class="card">${
   S.appt
     ? `<div class="flex"><span class="ri c-green" style="width:44px;height:44px;border-radius:12px;display:grid;place-items:center">${ic("cal")}</span><div class="sp"><b style="display:block">${fd(S.appt.d)} · ${S.appt.t} น.</b><span class="muted">สำนักงานตรวจคนเข้าเมือง</span></div></div><button class="btn btn-line btn-sm mt12" style="width:100%" onclick="S.appt=null;S.apDate=null;S.apTime=null;render();toast('ยกเลิกนัดหมายแล้ว')">ยกเลิกนัดหมาย</button>`
     : `<div class="muted" style="margin-bottom:10px">สำหรับกรณีที่ต้องยื่นด้วยตนเอง</div>
  <div class="slots">${wd
    .map((x) => {
      const y = D(x);
      return `<button class="slot ${S.apDate === x ? "on" : ""}" onclick="S.apDate='${x}';render()">${DOW[y.getDay()]}<b>${y.getDate()}</b>${TH_M[y.getMonth()]}</button>`;
    })
    .join("")}</div>
  <div class="times">${["09:00", "10:30", "13:30", "15:00"].map((t, i) => `<button class="${S.apTime === t ? "on" : ""}" ${i === 1 && S.apDate === wd[0] ? "disabled" : ""} onclick="S.apTime='${t}';render()">${t}</button>`).join("")}</div>
  <button class="btn btn-primary btn-sm" style="width:100%;height:44px" onclick="book()">ยืนยันนัดหมาย</button>`
 }</div>
 </div>${nav("track")}`;
      };

      /* ==================================================================
       * 10. MODAL — หน้าต่างยืนยันหลังส่งคำขอสำเร็จ (แสดงหมายเลขอ้างอิง)
       * ================================================================== */
      function showModal() {
        const m = S.modal,
          s = SV[m.svc],
          w = document.getElementById("modalwrap");
        const r = S.requests.find((x) => x.id === m.id);
        // หน้ายื่นสำเร็จแบบเต็มจอ — "ขั้นต่อไป" ใช้ SV[id].track เดิม
        w.innerHTML = `<div class="done-page"><div class="dp-scroll">
 <div class="dp-hero"><div class="dp-ic">${ic("check", 46)}</div><h3>${m.svc === "tm30" ? "ส่งข้อความเรียบร้อย" : "ยื่นคำขอสำเร็จ"}</h3><p>${s.name}</p></div>
 <div class="card refcard"><small>หมายเลขอ้างอิง</small><b>${m.id}</b><button class="btn btn-ghost btn-sm" onclick="copyRef('${m.id}')">${ic("copy", 16)} คัดลอก</button></div>
 <div class="sec-title">ขั้นต่อไป</div>
 <div class="card"><ol class="nexts">${s.track.map((t, i) => `<li class="${i === 0 ? "done" : i === 1 ? "now" : ""}"><b>${t}</b>${i === 0 && r ? `<small>${fd(r.date)}</small>` : ""}</li>`).join("")}</ol>
 <div class="dp-note">${ic("bell", 16)}<span>แอปจะแจ้งเตือนทุกครั้งที่สถานะเปลี่ยน ติดตามได้ที่แท็บ "สถานะ"</span></div></div>
 </div>
 <div class="dp-foot"><button class="btn btn-primary" onclick="closeModal('track')">ติดตามสถานะ</button><button class="btn btn-ghost mt8" onclick="closeModal('home')">กลับหน้าหลัก</button></div></div>`;
        w.classList.add("show");
      }
      /** คัดลอกหมายเลขอ้างอิง */
      function copyRef(id) {
        try {
          navigator.clipboard && navigator.clipboard.writeText(id);
        } catch (e) {}
        toast("คัดลอกหมายเลขอ้างอิงแล้ว");
      }
      /** ปิด modal ล้างบริการที่ทำอยู่ แล้วไปแท็บที่ระบุ */
      function closeModal(to) {
        document.getElementById("modalwrap").classList.remove("show");
        S.agree = false;
        S.svc = null;
        tab(to);
      }

      /* ==================================================================
       * 11. HELP SHEET — ช่วยเหลือ 3 แท็บ: ผู้ช่วย AI (จำลอง) / คู่มือ / คุยกับเจ้าหน้าที่
       *
       * QA = คำถาม-คำตอบสำเร็จรูป ผู้ช่วย AI จับคำสำคัญในคำถามแล้วเลือกคำตอบจากที่นี่
       * ================================================================== */
      const QA = {
        diff: {
          q: "รายงานตัว 90 วัน ต่อวีซ่า และ Re-entry ต่างกันอย่างไร?",
          a: "• รายงานตัว 90 วัน: แจ้งว่ายังพักอยู่ที่อยู่เดิม ทำทุก 90 วัน ไม่ได้ขยายวีซ่า\n• ต่ออายุวีซ่า: ขยายระยะเวลาที่อยู่ในไทย ต้องทำก่อนวีซ่าหมดอายุ\n• Re-entry: ขออนุญาตก่อนออกนอกประเทศ เพื่อให้วีซ่าเดิมยังใช้ได้เมื่อกลับมา",
        },
        reentry: {
          q: "ถ้าออกนอกประเทศโดยไม่ขอ Re-entry จะเป็นอย่างไร?",
          a: "การอนุญาตให้พำนักและวีซ่าเดิมจะสิ้นสุดทันทีเมื่อออกจากไทย คุณจะต้องขอวีซ่าใหม่ก่อนกลับเข้ามา จึงควรขอ Re-entry ให้เรียบร้อยก่อนวันเดินทาง",
        },
        move: {
          q: "ย้ายที่พักใหม่ต้องทำอะไรบ้าง?",
          a: 'เจ้าของที่พักต้องแจ้ง ตม.30 ภายใน 24 ชั่วโมงหลังคุณย้ายเข้า คุณใช้บริการ "แจ้งที่พัก (ตม.30)" เพื่อสร้างข้อความสองภาษาส่งให้เจ้าของที่พักได้ทันที',
        },
        when: {
          q: "ควรเริ่มเตรียมต่อวีซ่าเมื่อไร?",
          a: "แนะนำให้เริ่มเตรียม 30 วันก่อนวีซ่าหมดอายุ โดยเฉพาะหนังสือรับรองจากมหาวิทยาลัยซึ่งอาจใช้เวลา 3–5 วันทำการ ขอผ่านแอปได้ในขั้นตอนตรวจเอกสาร",
        },
      };
      /** เปิด Help sheet ที่แท็บ t — ถ้าส่ง q (key ของ QA) มาด้วย จะถามคำถามนั้นให้อัตโนมัติ */
      function openHelp(t = "ai", q) {
        S.help.open = true;
        S.help.tab = t;
        renderSheet();
        if (q) ask(q);
      }
      function closeHelp() {
        S.help.open = false;
        renderSheet();
      }
      /**
       * ถามผู้ช่วย AI: k = key ของ QA (กดชิปคำถาม) หรือ free = ข้อความที่พิมพ์เอง
       * แสดงจุด "กำลังพิมพ์" 0.7 วินาทีก่อนตอบ
       */
      function ask(k, free) {
        const h = S.help;
        // กันคำตอบซ้อน: ระหว่าง AI กำลังพิมพ์ ไม่รับคำถามใหม่
        if (h.typing) return;
        // คำถามสำเร็จรูปที่ถามไปแล้ว ไม่ต้องถามซ้ำ (เช่น กดการ์ดบนหน้า Home หลายครั้ง)
        if (!free && h.chat.some((m) => m.me && m.t === QA[k].q)) return;
        let a;
        if (free) {
          h.chat.push({ me: 1, t: free });
          const s = free.toLowerCase();
          a =
            /90/.test(s) && /(ต่ออายุ|ต่อวีซ่า|extend)/.test(s)
              ? QA.diff.a
              : /re-?entry|ออกนอก|กลับบ้าน/.test(s)
                ? QA.reentry.a
                : /ย้าย|ตม\.?30|tm\.?30|ที่พัก/.test(s)
                  ? QA.move.a
                  : /ต่ออายุ|ต่อวีซ่า|หมดอายุ|extend/.test(s)
                    ? QA.when.a
                    : /90/.test(s)
                      ? QA.diff.a
                      : 'ขอบคุณสำหรับคำถาม ต้นแบบนี้ตอบได้เฉพาะคำถามตัวอย่าง หากต้องการคำตอบเฉพาะกรณี กรุณาเลือกแท็บ "เจ้าหน้าที่" เพื่อติดต่อเจ้าหน้าที่';
        } else {
          h.chat.push({ me: 1, t: QA[k].q });
          a = QA[k].a;
        }
        h.typing = true;
        renderSheet();
        setTimeout(() => {
          h.typing = false;
          h.chat.push({ t: a });
          renderSheet();
        }, 700);
      }
      /** ส่งคำถามจากช่องพิมพ์ */
      function sendFree() {
        const i = document.getElementById("ask");
        const v = i && i.value.trim();
        if (!v) return;
        ask(null, v);
      }
      /** วาด Help sheet ตามแท็บที่เลือก (ทำงานแยกจาก render() ของหน้าหลัก) */
      function renderSheet() {
        const w = document.getElementById("sheetwrap"),
          h = S.help;
        if (!h.open) {
          w.classList.remove("show");
          w.innerHTML = "";
          return;
        }
        let body,
          foot = "";
        if (h.tab === "ai") {
          body = `<div class="msg bot">สวัสดีค่ะ ยินดีให้บริการข้อมูลด้านวีซ่าและการพำนัก กรุณาเลือกหรือพิมพ์คำถาม</div>
  ${h.chat.map((m) => `<div class="msg ${m.sys ? "sys" : m.me ? "me" : "bot"}">${esc(m.t)}</div>`).join("")}
  ${h.typing ? `<div class="msg bot"><span class="typing"><i></i><i></i><i></i></span></div>` : ""}
  ${
    !h.typing
      ? `<div class="qchips">${Object.keys(QA)
          .filter((k) => !h.chat.some((m) => m.t === QA[k].q))
          .map((k) => `<button onclick="ask('${k}')">${QA[k].q}</button>`)
          .join("")}</div>`
      : ""
  }
  <p class="muted" style="font-size:11.5px;text-align:center">คำตอบเป็นข้อมูลจำลองเพื่อการสาธิต</p>`;
          foot = `<div class="sheet-f"><input id="ask" placeholder="พิมพ์คำถาม…" onkeydown="if(event.key==='Enter')sendFree()"><button class="send" onclick="sendFree()" aria-label="ส่ง">${ic("send", 20)}</button></div>`;
        } else if (h.tab === "guide") {
          body = `<div class="card"><b style="display:block;margin-bottom:4px">หน้าที่ระหว่างพำนักในประเทศไทย</b>
  ${[
    [
      "แจ้งที่พัก (ตม.30)",
      "ทุกครั้งที่ย้ายที่พัก เจ้าของที่พักต้องแจ้งภายใน 24 ชั่วโมง",
    ],
    [
      "รายงานตัวทุก 90 วัน",
      "นับจากวันเข้าประเทศครั้งล่าสุด ยื่นได้ตั้งแต่ 15 วันก่อน ถึง 7 วันหลังครบกำหนด",
    ],
    ["ต่ออายุวีซ่า", "ยื่นก่อนวีซ่าหมดอายุ"],
    ["Re-entry Permit", "ต้องขอก่อนเดินทางออกนอกประเทศทุกครั้ง"],
    ["TDAC", "กรอกภายใน 3 วันก่อนเดินทางถึงประเทศไทย"],
  ]
    .map(
      ([a, b]) =>
        `<details class="acc"><summary>${a}${ic("chev", 18)}</summary><p>${b}</p></details>`,
    )
    .join("")}</div>
  <div class="sec-title">ศูนย์ความรู้</div>
  ${[
    ["ED กับ ED Plus ต่างกันอย่างไร", "book"],
    ["ตัวอย่างการกรอกแบบ ตม.7", "doc"],
    ["เตรียมเอกสารจากมหาวิทยาลัย", "school"],
  ]
    .map(
      ([a, i]) =>
        `<button class="svc" onclick="toast('เปิดบทความ (จำลอง)')"><span class="ri c-blue">${ic(i)}</span><span class="rt"><b style="font-size:14px">${a}</b></span>${ic("chev", 18)}</button>`,
    )
    .join("")}`;
        } else {
          const queued = h.chat.some((m) => m.staff);
          body = `<div class="empty" style="padding-top:12px"><div class="ei c-violet">${ic("people", 30)}</div><b style="font-size:16px">คุยกับเจ้าหน้าที่</b><p class="muted mt8">สำหรับกรณีที่ซับซ้อน เช่น วีซ่าหมดอายุ ข้อมูลไม่ตรงกับระบบ หรือต้องการคำแนะนำเฉพาะ</p></div>
  ${
    queued
      ? `<div class="alert green"><div class="ai">${ic("check")}</div><div><b>อยู่ในคิวลำดับที่ 3</b><p>เวลารอโดยประมาณ 5 นาที · เจ้าหน้าที่จะเห็นข้อมูลวีซ่าของคุณโดยไม่ต้องอธิบายซ้ำ</p></div></div>`
      : `<div class="card"><div class="field"><label>เรื่องที่ต้องการปรึกษา</label><select id="topic">${["ต่ออายุวีซ่า", "รายงานตัว 90 วัน", "แจ้งที่พัก ตม.30", "Re-entry Permit", "อื่น ๆ"].map((o) => `<option>${o}</option>`).join("")}</select></div>
   <div class="field"><label>ภาษาที่ต้องการ</label><select><option>ไทย</option><option>English</option><option>中文</option></select></div>
   <button class="btn btn-primary" onclick="S.help.chat.push({staff:1,sys:1,t:'เชื่อมต่อเจ้าหน้าที่แล้ว · เรื่อง '+document.getElementById('topic').value});renderSheet();toast('ส่งต่อเจ้าหน้าที่แล้ว')">เริ่มแชทกับเจ้าหน้าที่</button></div>`
  }
  <div class="card mt12 flex"><span style="color:var(--navy)">${ic("clock")}</span><span class="muted">เวลาทำการ จ.–ศ. 08:30–16:30 น. (ข้อมูลจำลอง)</span></div>`;
        }
        w.innerHTML = `<div class="scrim" onclick="closeHelp()"></div><div class="sheet"><div class="sheet-h"><div class="grab"></div><div class="sheet-top"><h3>ช่วยเหลือ</h3><button class="iconbtn" onclick="closeHelp()" aria-label="ปิด">${ic("x")}</button></div>
 <div class="tabs">${[
   ["ai", "ผู้ช่วย AI"],
   ["guide", "คู่มือ"],
   ["staff", "เจ้าหน้าที่"],
 ]
   .map(
     ([k, l]) =>
       `<button class="${h.tab === k ? "on" : ""}" onclick="S.help.tab='${k}';renderSheet()">${l}</button>`,
   )
   .join("")}</div></div>
 <div class="sheet-b" id="sb_body">${body}</div>${foot}</div>`;
        w.classList.add("show");
        const b = document.getElementById("sb_body");
        if (b && h.tab === "ai") b.scrollTop = b.scrollHeight;
      }

      /* ==================================================================
       * 12. START — วาดหน้าแรก (Login) เมื่อโหลดไฟล์
       * ================================================================== */
      render(true);
    </script>
  </body>
</html>
